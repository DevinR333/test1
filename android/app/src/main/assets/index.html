  /* ------------------------------------------------ PAUSE / OPTIONS */
  /* The same screen serves as the in-game pause and as the options page
     off the map; only the top and bottom entries differ. */
  function fromPlay(G) { return G.optionsFrom !== 'map'; }

  function pauseItems(G) {
    var items = [];
    if (fromPlay(G)) {
      items.push({ k: 'resume', label: 'RESUME' });
      items.push({ k: 'restart', label: 'RESTART STAGE' });
    }
    items.push({ k: 'sound', label: 'SOUND',
      value: function () { return Sfx.isEnabled() ? 'ON' : 'OFF'; } });
    items.push({ k: 'zoom', label: 'ZOOM IN LEVELS',
      value: function () { return Game.zoomLabel(Save.get().zoom || 1); } });
    /* only worth offering once the screen has actually been touched */
    if (Input.mode() === 'touch') {
      items.push({ k: 'touch', label: 'TOUCH PAD',
        value: function () { return Input.touchMode() === 'always' ? 'ALWAYS ON' : 'AUTO HIDE'; } });
    }
    items.push(fromPlay(G) ? { k: 'quit', label: 'QUIT TO MAP' }
                           : { k: 'back', label: 'BACK TO MAP' });
    return items;
  }

  /* dir is -1, 0 or +1; 0 means "cycle forward" (a tap or a press) */
  function set_value(G, it, dir) {
    if (it.k === 'sound') {
      var d = Save.get();
      d.sound = !Sfx.isEnabled();
      Sfx.setEnabled(d.sound);
      Save.flush();
      if (d.sound && G.world) Sfx.playSong(G.world.def.boss ? 'boss' : G.world.theme);
    } else if (it.k === 'touch') {
      var d2 = Save.get();
      d2.touchMode = (Input.touchMode() === 'always') ? 'auto' : 'always';
      Input.setTouchMode(d2.touchMode);
      Save.flush();
    } else if (it.k === 'zoom') {
      var d3 = Save.get();
      var list = Game.ZOOMS;
      var at = list.indexOf(d3.zoom || 1);
      if (at < 0) at = 0;
      at = (at + (dir < 0 ? list.length - 1 : 1)) % list.length;
      d3.zoom = list[at];
      Save.flush();
      Game.applyZoom();
    }
    Sfx.select();
  }
  function activate(G, it) {
    if (it.k === 'resume') { Sfx.select(); G.state = 'play'; }
    else if (it.k === 'restart') { Sfx.confirm(); G.startStage(G.world.index); }
    else if (it.k === 'quit' || it.k === 'back') { Sfx.select(); G.go('map'); }
    else if (it.value) set_value(G, it, 0);
    else Sfx.select();
  }

  var pause = {
    update: function (G) {
      var items = pauseItems(G);
      if (G.pauseSel >= items.length) G.pauseSel = 0;

      var w0 = 214, h0 = 48 + items.length * 18;
      var bx0 = Math.round(VIEW_W / 2 - w0 / 2), by0 = Math.round(VIEW_H / 2 - h0 / 2);
      var tap = Input.takeTap();
      if (tap) {
        for (var pi = 0; pi < items.length; pi++) {
          var rr = { x: bx0 + 6, y: by0 + 27 + pi * 18, w: w0 - 12, h: 16 };
          if (inRect(tap, rr)) {
            if (G.pauseSel !== pi) { G.pauseSel = pi; Sfx.select(); }
            else if (items[pi].value) {
              /* tapping the right half nudges the value along */
              set_value(G, items[pi]);
            } else {
              activate(G, items[pi]);
            }
            return;
          }
        }
      }

      if (Input.pressed('down')) { G.pauseSel = (G.pauseSel + 1) % items.length; Sfx.select(); }
      if (Input.pressed('up')) { G.pauseSel = (G.pauseSel + items.length - 1) % items.length; Sfx.select(); }

      var it = items[G.pauseSel];
      var nudge = Input.pressed('left') ? -1 : (Input.pressed('right') ? 1 : 0);
      if (nudge && it.value) set_value(G, it, nudge);

      if (Input.pressed('confirm') || Input.pressed('jump')) activate(G, it);
      if (Input.pressed('pause')) {
        Sfx.select();
        if (fromPlay(G) && G.world) G.state = 'play'; else G.go('map');
      }
      if (Input.pressed('restart') && fromPlay(G) && G.world) {
        Sfx.confirm(); G.startStage(G.world.index);
      }
    },
    draw: function (g, G) {
      if (fromPlay(G) && G.world) { G.world.draw(g); dim(g, 0.72); }
      else { backdrop(g, G.t); }
      var items = pauseItems(G);
      var w = 214, h = 48 + items.length * 18;
      var x = Math.round(VIEW_W / 2 - w / 2), y = Math.round(VIEW_H / 2 - h / 2);
      panel(g, x, y, w, h);
      Text.centerShadow(g, fromPlay(G) ? 'PAUSED' : 'OPTIONS',
        VIEW_W / 2, y + 10, '#ffffff', 2);

      for (var i = 0; i < items.length; i++) {
        var iy = y + 32 + i * 18;
        var on = i === G.pauseSel;
        if (on) {
          g.fillStyle = 'rgba(255,215,94,.12)';
          g.fillRect(x + 6, iy - 5, w - 12, 16);
          cursor(g, x + 10, iy - 1, G.t);
        }
        Text.draw(g, items[i].label, x + 24, iy, on ? '#ffffff' : '#9d92b8', 1);
        if (items[i].value) {
          var v = items[i].value();
          Text.draw(g, '<', x + w - 86, iy, on ? '#ffd75e' : '#5d5478', 1);
          Text.draw(g, v, x + w - 76, iy, on ? '#ffd75e' : '#7f72a0', 1);
          Text.draw(g, '>', x + w - 14, iy, on ? '#ffd75e' : '#5d5478', 1);
        }
      }
      Text.center(g, hint('INPUT: KEYBOARD', 'INPUT: CONTROLLER', 'TAP AN ITEM'),
        VIEW_W / 2, y + h - 12, '#6d6488', 1);
    }
  };

  /* ------------------------------------------------ RESULTS */
  function continueRect() {
    var w = 118, h = 22;
    return { x: Math.round(VIEW_W / 2 - w / 2), y: VIEW_H - 30, w: w, h: h };
  }
  /* The two buttons are the only way off a results screen. A stray tap
     or a leftover button press must not skip it. */
  function anyInput() { return false; }

  var clear = {
    update: function (G) {
      if (G.resultT > 0) { G.resultT--; }
      if (G.autoOut === undefined) G.autoOut = 0;
      G.autoOut++;
      if (anyInput()) {
        G.autoOut = 0;
        Sfx.confirm();
        if (Save.allCleared() && G.lastStage === LEVELS.length - 1) G.go('ending');
        else G.go('map');
      }
    },
    draw: function (g, G) {
      backdrop(g, G.t);
      /* the sheet floats in the middle of whatever height we were given,
         and the two buttons live below it on the page itself */
      var ph = 84, py = Math.round((VIEW_H - 52) / 2 - ph / 2) + 4;
      Text.centerShadow(g, 'STAGE CLEAR', VIEW_W / 2, py - 26, '#ffd75e', 2);

      /* the good boy, pleased with himself, clear of the sign */
      var bob = Math.round(Math.sin(G.t * 0.07) * 2);
      g.drawImage(Art.dog.right.idle,
        Math.round(VIEW_W / 2 - 158), py + ph - 30 + bob, 36, 28);

      panel(g, VIEW_W / 2 - 110, py, 220, ph);
      var px0 = VIEW_W / 2 - 96, pv = VIEW_W / 2 - 34;
      Text.draw(g, 'STAGE', px0, py + 12, '#c7b79a', 1);
      Text.draw(g, LEVELS[G.lastStage].name, pv, py + 12, '#ffffff', 1);
      Text.draw(g, 'COIN', px0, py + 30, '#c7b79a', 1);
      g.drawImage(Art.COIN, pv - 2, py + 29);
      Text.draw(g, '+' + G.resultCoins, pv + 10, py + 30, '#ffe27a', 1);
      Text.draw(g, 'GEMS', px0, py + 48, '#c7b79a', 1);
      var rg = Art.THEME_GEMS[LEVELS[G.lastStage].theme] || Art.THEME_GEMS.meadow;
      for (var gI = 0; gI < 3; gI++) {
        if (gI < G.resultGems) g.drawImage(rg, pv - 2 + gI * 9, py + 47);
        else { g.fillStyle = '#453a2c'; g.fillRect(pv - 1 + gI * 9, py + 48, 5, 5); }
      }
      Text.draw(g, G.resultChests + ' CHEST' + (G.resultChests === 1 ? '' : 'S'),
        pv + 30, py + 48, G.resultChests ? '#e8c45c' : '#8a7c66', 1);
      Text.draw(g, 'PURSE', px0, py + 66, '#c7b79a', 1);
      Text.draw(g, String(Save.get().coins), pv, py + 66, '#ffe27a', 1);
      /* say plainly what PLAY AGAIN does, because it is not obvious */
      Text.centerShadow(g, 'THIS HAUL IS SAVED', VIEW_W / 2, py + ph + 8, '#ffe9a0', 1);
      Text.centerShadow(g, 'PLAY AGAIN TO GO BACK FOR THE REST',
        VIEW_W / 2, py + ph + 22, '#eaf4ff', 1);
      Text.shadow(g, 'BUILD ' + (window.BUILD_ID || 'DEV'), 6, VIEW_H - 10, '#dfe8d4', 1);
    }
  };

  function retryRect() { return { x: Math.round(VIEW_W / 2 - 122), y: VIEW_H - 32, w: 116, h: 22 }; }
  function quitRect() { return { x: Math.round(VIEW_W / 2 + 6), y: VIEW_H - 32, w: 116, h: 22 }; }

  var fail = {
    update: function (G) {
      if (G.resultT > 0) { G.resultT--; }
      Input.clearTaps();
    },
    draw: function (g, G) {
      backdrop(g, G.t, 'dusk');
      var cy = Math.round((VIEW_H - 40) / 2);
      Text.centerShadow(g, 'DOWN BOY', VIEW_W / 2, cy - 54, '#e0424f', 3);
      /* ears down, eye shut - he is not happy about this */
      var droop = Math.round(Math.sin(G.t * 0.035) * 1);
      g.drawImage(Art.dog.right.sad, Math.round(VIEW_W / 2 - 18), cy - 16 + droop, 36, 28);

      var lost = (G.lostCoins || 0) + (G.lostGems || 0) + (G.lostChests || 0);
      if (lost > 0) {
        Text.centerShadow(g, 'THE RUN IS LOST WITH HIM', VIEW_W / 2, cy + 20, '#ffd0d6', 1);
        var bits = [];
        if (G.lostCoins) bits.push(G.lostCoins + ' COIN');
        if (G.lostGems) bits.push(G.lostGems + ' GEM' + (G.lostGems === 1 ? '' : 'S'));
        if (G.lostChests) bits.push(G.lostChests + ' CHEST' + (G.lostChests === 1 ? '' : 'S'));
        Text.centerShadow(g, 'DROPPED: ' + bits.join('   '), VIEW_W / 2, cy + 34, '#f3c9a0', 1);
      } else {
        Text.centerShadow(g, 'NOTHING GAINED, NOTHING LOST', VIEW_W / 2, cy + 20, '#ffd0d6', 1);
      }
      Text.centerShadow(g, 'WHAT YOU KEPT BEFORE THIS RUN IS SAFE',
        VIEW_W / 2, cy + 48, '#e6e0d0', 1);
      Text.shadow(g, 'BUILD ' + (window.BUILD_ID || 'DEV'), 6, VIEW_H - 10, '#dfe8d4', 1);
    }
  };

  var ending = {
    update: function (G) {
      if (anyInput()) { Sfx.confirm(); G.go('title'); }
    },
    draw: function (g, G) {
      backdrop(g, G.t);
      var ey = Math.round(VIEW_H * 0.13);
      Text.centerShadow(g, 'GOOD DOG', VIEW_W / 2, ey, '#ffd75e', 3);
      Text.centerShadow(g, 'THE KEEP IS QUIET. THE GARDEN IS SAFE.', VIEW_W / 2, ey + 40, '#f3f8ff', 1);
      Text.centerShadow(g, 'YOU HAVE EARNED THE NAP.', VIEW_W / 2, ey + 54, '#f3f8ff', 1);
      var bob = Math.round(Math.sin(G.t * 0.05) * 2);
      g.drawImage(Art.dog.right.sit, VIEW_W / 2 - 18, ey + 76 + bob, 36, 28);
      Text.centerShadow(g, 'GEMS  ' + Save.gemsFound() + ' / ' + Save.gemsTotal() +
        '     CHESTS  ' + Save.chestsFound(), VIEW_W / 2, ey + 122, '#bff0ff', 1);
      Text.centerShadow(g, 'COIN IN THE PURSE  ' + Save.get().coins, VIEW_W / 2, ey + 136, '#ffe27a', 1);
      if (Math.floor(G.t / 26) % 2 === 0) {
        Text.center(g, hint('PRESS ENTER', 'PRESS A', 'TAP TO CONTINUE'),
          VIEW_W / 2, VIEW_H - 16, '#ffffff', 1);
      }
    }
  };

  return { title: title, map: map, shop: shop, pause: pause,
           clear: clear, fail: fail, ending: ending, panel: panel, dim: dim, backdrop: backdrop };
})();

/* ===== game.js ===== */
/* Boot, scaling, fixed-step loop and the screen state machine. */
var Game = (function () {
  var cv, g, acc = 0, last = 0;
  var STEP = 1000 / 60;

  var G = {
    state: 'title',
    prevState: null,
    world: null,
    sel: 0,
    shopSel: 0,
    shopTab: 0,
    btnSel: 1,
    pauseSel: 0,
    shopMsg: '', shopMsgT: 0,
    t: 0,
    lastStage: 0,
    resultCoins: 0,
    autoOut: 0,
    resultGems: 0,
    resultChests: 0,
    resultT: 0,
    fade: 0,          /* 0 = clear, 1 = black */
    fadeDir: 0,
    pending: null
  };

  /* The design reference is 400x224. Rather than pinning one axis and
     letting the other go short, the view is scaled so that reference
     ALWAYS fits, then whichever axis has room shows more world. A 4:3
     screen therefore gets the full width plus extra height instead of a
     cramped, narrow picture, and an ultrawide gets extra width. Pixels
     stay square in every case, and the picture fills the display. */
  var BASE_W = 400, BASE_H = 224;

  /* FIT is the baseline: the scale at which the 400x224 reference just
     fits the screen. Every zoom step multiplies that scale, so the
     picture only ever gets BIGGER and the aspect ratio never changes -
     zooming out, and the squashed views that came with it, are gone. */
  G.ZOOMS = [1, 1.25, 1.5, 1.75, 2];
  G.zoomLabel = function (z) {
    if (!z || z <= 1) return 'FIT';
    return 'X' + (Math.round(z * 100) % 100 ? z.toFixed(2).replace(/0$/, '') : z);
  };

  var zoomed = false;            /* is the canvas currently cropped in? */
  var zoomAt = 1;                /* the factor the canvas was last sized at */

  function fitCanvas() {
    /* measure the padded wrapper, not the window: on a phone the notch
       and the navigation bar sit inside innerWidth/innerHeight and were
       clipping the bottom row off the screen */
    var host = document.getElementById('wrap');
    var vw = host ? host.clientWidth : window.innerWidth;
    var vh = host ? host.clientHeight : window.innerHeight;
    if (!vw || !vh) return;

    var fit = Math.min(vw / BASE_W, vh / BASE_H);

    /* the view at FIT, which is the most world anyone ever sees */
    var fitW = Math.max(BASE_W, Math.min(760, Math.round(vw / fit / 2) * 2));
    var fitH = Math.max(BASE_H, Math.min(440, Math.round(vh / fit / 2) * 2));

    /* Zoom applies in levels only. The menus are laid out for a screen at
       least this big, and cropping them would push their own furniture
       off the edge - exactly the bottom-cut-off complaint. */
    var z = 1;
    if (zoomed) {
      try { z = Save.get().zoom || 1; } catch (e) { z = 1; }
      if (!(z >= 1)) z = 1;                  /* old saves stored 0 for FIT */
    }
    /* One factor drives BOTH axes, including when the floor caps it, so
       the shape of the picture is identical at every step. */
    var MINW = 200, MINH = 112;
    var zEff = Math.min(z, fitW / MINW, fitH / MINH);
    if (!(zEff >= 1)) zEff = 1;

    VIEW_W = Math.round(fitW / zEff / 2) * 2;
    VIEW_H = Math.round(fitH / zEff / 2) * 2;

    if (cv.width !== VIEW_W || cv.height !== VIEW_H) {
      cv.width = VIEW_W;
      cv.height = VIEW_H;
    }
    g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;

    /* one uniform scale for both axes - never stretched */
    var s2 = Math.min(vw / VIEW_W, vh / VIEW_H);
    cv.style.width = Math.round(VIEW_W * s2) + 'px';
    cv.style.height = Math.round(VIEW_H * s2) + 'px';
  }

  G.go = function (state) {
    G.pending = state;
    G.fadeDir = 1;
  };
  function enter(state) {
    G.prevState = G.state;
    G.state = state;
    /* a tap that advanced the last screen must not also press something
       on the next one */
    Input.clearTaps();
    G.autoOut = 0;
    if (state === 'map') { Sfx.stopSong(); }
    if (state === 'title') { Sfx.stopSong(); }
  }

  G.applyZoom = function () { fitCanvas(); };

  G.startStage = function (index) {
    G.lastStage = index;
    /* what the purse looked like before this attempt */
    G.runSnapshot = Save.snapshot();
    G.pending = 'play';
    G.pendingStage = index;
    G.fadeDir = 1;
  };

  G.onLevelClear = function () {
    var w = G.world;
    G.resultCoins = w.coinsRun;
    G.resultGems = w.gemsGot;
    G.resultChests = w.chestsGot;
    G.resultT = 26;
    Save.clearStage(w.index, w.gemsGot, w.chestsGot);
    Save.flush();
    G.go('clear');
  };
  G.onLevelFailed = function () {
    G.resultT = 30;
    /* Go down and the run is forfeit - coin, gems, chests and anything a
       chest handed over all go back to where they stood at the gate. */
    var w = G.world;
    G.lostCoins = w ? w.coinsRun : 0;
    G.lostGems = w ? w.gemsGot : 0;
    G.lostChests = w ? w.chestsGot : 0;
    Save.restore(G.runSnapshot);
    Save.flush();
    G.go('fail');
  };

  function screen() {
    switch (G.state) {
      case 'title': return UI.title;
      case 'map': return UI.map;
      case 'shop': return UI.shop;
      case 'pause': return UI.pause;
      case 'clear': return UI.clear;
      case 'fail': return UI.fail;
      case 'ending': return UI.ending;
    }
    return null;
  }

  function update() {
    G.t++;
    Input.pollPad();
    Sfx.tick();

    if (Input.pressed('mute')) {
      var d = Save.get();
      d.sound = !d.sound;
      Sfx.setEnabled(d.sound);
      Save.flush();
      if (d.sound && G.state === 'play' && G.world) {
        Sfx.playSong(G.world.def.boss ? 'boss' : G.world.theme);
      }
    }

    /* screen transition */
    if (G.fadeDir === 1) {
      G.fade = Math.min(1, G.fade + 0.12);
      if (G.fade >= 1) {
        if (G.pending === 'clear' || G.pending === 'fail') G.btnSel = 1;
        if (G.pending === 'play') {
          G.world = new World(G.pendingStage != null ? G.pendingStage : G.lastStage);
          G.pendingStage = null;
          enter('play');
        } else if (G.pending) enter(G.pending);
        G.pending = null;
        G.fadeDir = -1;
      }
      Input.endFrame();
      return;
    } else if (G.fadeDir === -1) {
      G.fade = Math.max(0, G.fade - 0.1);
      if (G.fade <= 0) G.fadeDir = 0;
    }

    /* Outside gameplay the touch pad stays put, and on screens that only
       wait for "carry on" a tap anywhere counts. */
    var justCarryOn = (G.state === 'clear' || G.state === 'fail' ||
                       G.state === 'ending' || G.state === 'title');
    Input.setMenuMode(G.state !== 'play', justCarryOn);
    syncMenuButtons();
    syncPopupButton();

    /* A controller cannot touch an HTML button, so drive them here. */
    if (G.state === 'clear' || G.state === 'fail') {
      if (Input.pressed('left')) { G.btnSel = 0; Sfx.select(); }
      if (Input.pressed('right')) { G.btnSel = 1; Sfx.select(); }
      if (Input.pressed('confirm') || Input.pressed('jump') || Input.pressed('attack')) {
        Save.flush();
        if (G.btnSel === 0) { Sfx.select(); G.go('map'); }
        else { Sfx.confirm(); G.startStage(G.lastStage); }
        Input.endFrame();
        return;
      }
    }

    if (G.state === 'play' && G.world && G.world.popupBlocking()) {
      if (Input.pressed('confirm') || Input.pressed('jump') || Input.pressed('attack')) {
        G.world.dismissPopup();
        Sfx.select();
      }
      Input.endFrame();
      return;
    }

    if (G.state === 'play') {
      if (Input.pressed('pause')) { Sfx.select(); G.state = 'pause'; }
      else if (Input.pressed('restart')) { Sfx.confirm(); G.startStage(G.world.index); }
      else G.world.update();
    } else {
      var s = screen();
      if (s) s.update(G);
    }
    Input.endFrame();
  }

  function draw() {
    /* levels are drawn at the player's zoom, menus always at FIT; catching
       it here means no state transition can forget to resize */
    var wantZoom = (G.state === 'play' || G.state === 'pause');
    var wantZ = 1;
    if (wantZoom) { try { wantZ = Save.get().zoom || 1; } catch (e) { wantZ = 1; } }
    if (wantZoom !== zoomed || wantZ !== zoomAt) {
      zoomed = wantZoom; zoomAt = wantZ; fitCanvas();
    }
    g.imageSmoothingEnabled = false;
    if (G.state === 'play' && G.world) G.world.draw(g);
    else {
      var s = screen();
      if (s) s.draw(g, G);
    }
    if (G.fade > 0) {
      g.fillStyle = 'rgba(6,4,10,' + G.fade + ')';
      g.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  /* One thrown error used to kill the animation loop outright, which
     froze the game and made every control look dead. Keep the loop
     running no matter what, and report the first failure. */
  var reported = false;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(now - last, 250);
    last = now;
    acc += dt;
    var guard = 0;
    try {
      while (acc >= STEP && guard++ < 5) { update(); acc -= STEP; }
    } catch (e) {
      acc = 0;
      Input.endFrame();
      if (!reported) { reported = true; G.lastError = String(e && e.message || e); }
      if (window.console) console.error('update failed:', e);
    }
    try {
      draw();
    } catch (e2) {
      if (window.console) console.error('draw failed:', e2);
    }
    requestAnimationFrame(frame);
  }

  /* Show the two result-screen buttons, label them for the screen we are
     on, and wire them straight to the action. */
  var menuEl, mbLeft, mbRight;
  function initMenuButtons() {
    menuEl = document.getElementById('menubtns');
    mbLeft = document.getElementById('mb-left');
    mbRight = document.getElementById('mb-right');
    if (!menuEl) return;
    function press(el, fn) {
      var go = function (e) { e.preventDefault(); e.stopPropagation(); fn(); };
      el.addEventListener('click', go);
      el.addEventListener('touchend', go, { passive: false });
    }
    press(mbLeft, function () {
      Sfx.select();
      Save.flush();
      G.go('map');
    });
    press(mbRight, function () {
      Sfx.confirm();
      Save.flush();              /* keep everything earned this run */
      G.startStage(G.lastStage);
    });
  }
  var popEl, pbOk;
  function initPopupButton() {
    popEl = document.getElementById('popupbtn');
    pbOk = document.getElementById('pb-ok');
    if (!popEl) return;
    var go = function (e) {
      e.preventDefault(); e.stopPropagation();
      if (G.world) G.world.dismissPopup();
      Sfx.select();
    };
    pbOk.addEventListener('click', go);
    pbOk.addEventListener('touchend', go, { passive: false });
  }
  function syncPopupButton() {
    if (!popEl) return;
    var on = (G.state === 'play' && G.world && G.world.popupBlocking());
    if (on) popEl.classList.remove('hidden');
    else popEl.classList.add('hidden');
  }

  function syncMenuButtons() {
    if (!menuEl) return;
    var show = (G.state === 'clear' || G.state === 'fail');
    if (!show) { menuEl.classList.add('hidden'); return; }
    menuEl.classList.remove('hidden');
    mbLeft.textContent = 'LEVEL SELECT';
    mbRight.textContent = (G.state === 'fail') ? 'TRY AGAIN' : 'PLAY AGAIN';
    /* show which one a pad or keyboard would press */
    if (G.btnSel === 0) { mbLeft.classList.add('sel'); mbRight.classList.remove('sel'); }
    else { mbRight.classList.add('sel'); mbLeft.classList.remove('sel'); }
  }

  function boot() {
    cv = document.getElementById('screen');
    g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    Save.load();
    Sfx.setEnabled(Save.get().sound !== false);
    Input.init();
    initMenuButtons();
    initPopupButton();
    Input.setTouchMode(Save.get().touchMode || 'auto');
    fitCanvas();
    window.addEventListener('resize', fitCanvas);
    /* audio contexts need a gesture before they will make noise */
    var wake = function () { Sfx.resume(); };
    window.addEventListener('keydown', wake, { once: true });
    window.addEventListener('pointerdown', wake, { once: true });
    /* start the cursor on the newest unlocked stage */
    G.sel = Util.clamp(Save.get().unlocked - 1, 0, LEVELS.length - 1);
    requestAnimationFrame(frame);
  }

  G.boot = boot;
  return G;
})();
window.addEventListener('DOMContentLoaded', Game.boot);
