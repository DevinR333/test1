  this.player = new Player(spawn.x, spawn.y);
  this.spawn = spawn;
  this.lastSafe = { x: spawn.x, y: spawn.y };

  if (def.boss && this.bossSpawn) {
    this.boss = new Boss(this.bossSpawn.x, this.bossSpawn.y, def.boss);
    this.bossIntro = 90;
  }

  /* depth below the surface, so buried rock can fall into shadow */
  this.depth = [];
  for (y = 0; y < this.rows; y++) {
    var drow = [];
    for (x = 0; x < this.cols; x++) {
      if (!this.isWallLooking(this.tiles[y][x])) { drow.push(-1); continue; }
      drow.push((y > 0 && this.depth[y - 1][x] >= 0) ? this.depth[y - 1][x] + 1 : 0);
    }
    this.depth.push(drow);
  }

  this.decor = this.buildDecor();

  this.cam = { x: 0, y: 0 };
  this.centerCamera();
  this.shakeAmt = 0;
  this.t = 0;
  this.state = 'play';           /* play | dying | clear */
  this.stateTimer = 0;
  this.coinsRun = 0;
  this.secretShown = false;
  this.bannerTimer = 150;
  this.hitStop = 0;
  Sfx.playSong(def.boss ? 'boss' : def.theme);
}

/* ---------------- tiles ---------------- */
World.prototype.tileAt = function (tx, ty) {
  if (ty < 0 || ty >= this.rows) return T_EMPTY;
  if (tx < 0 || tx >= this.cols) return T_SOLID;   /* level edges are walls */
  return this.tiles[ty][tx];
};
World.prototype.isSolidCode = function (c) {
  /* Ledges collide on every face. Nothing in this game passes through
     floors - you go around, or you find another way up. */
  return c === T_SOLID || c === T_CRATE || c === T_SPRING || c === T_PLAT;
};
/* Drawn as masonry, so it has to be hashed like masonry too. */
World.prototype.isWallLooking = function (c) {
  return c === T_SOLID || c === T_FAKE;
};
/* Only the hero slips through a false wall. For everything else it is
   ordinary stone - otherwise a patrolling enemy strolls through the
   secret and advertises exactly where it is. */
World.prototype.solidFor = function (e, c) {
  if (c === T_FAKE) return e !== this.player;
  return this.isSolidCode(c);
};
World.prototype.solidAt = function (px, py) {
  return this.isSolidCode(this.tileAt(Math.floor(px / TILE), Math.floor(py / TILE)));
};
World.prototype.codeAtPx = function (px, py) {
  return this.tileAt(Math.floor(px / TILE), Math.floor(py / TILE));
};

/* ---------------- movement ---------------- */
World.prototype.moveActor = function (e, loose, flyer) {
  e.hitWall = false;
  var prevBottom = e.y + e.h;
  var prevTop = e.y;
  var tx, ty, x1, x2, y1, y2, i, m;

  /* --- horizontal --- */
  e.x += e.vx;
  x1 = Math.floor(e.x / TILE); x2 = Math.floor((e.x + e.w - 1) / TILE);
  y1 = Math.floor(e.y / TILE); y2 = Math.floor((e.y + e.h - 1) / TILE);
  for (ty = y1; ty <= y2; ty++) {
    for (tx = x1; tx <= x2; tx++) {
      if (!this.solidFor(e, this.tileAt(tx, ty))) continue;
      if (e.vx > 0) { e.x = tx * TILE - e.w; e.vx = 0; e.hitWall = true; }
      else if (e.vx < 0) { e.x = (tx + 1) * TILE; e.vx = 0; e.hitWall = true; }
      x1 = Math.floor(e.x / TILE); x2 = Math.floor((e.x + e.w - 1) / TILE);
    }
  }
  for (i = 0; i < this.movers.length; i++) {
    m = this.movers[i];
    if (Util.aabb(e, m) && prevBottom > m.y + 3) {
      if (e.vx > 0) { e.x = m.x - e.w; e.vx = 0; e.hitWall = true; }
      else if (e.vx < 0) { e.x = m.x + m.w; e.vx = 0; e.hitWall = true; }
    }
  }

  /* --- vertical --- */
  e.y += e.vy;
  e.grounded = false;
  x1 = Math.floor(e.x / TILE); x2 = Math.floor((e.x + e.w - 1) / TILE);
  y1 = Math.floor(e.y / TILE); y2 = Math.floor((e.y + e.h - 1) / TILE);
  for (ty = y1; ty <= y2; ty++) {
    for (tx = x1; tx <= x2; tx++) {
      var code = this.tileAt(tx, ty);
      if (this.solidFor(e, code)) {
        if (e.vy > 0) {
          e.y = ty * TILE - e.h; e.vy = 0; e.grounded = true;
          if (code === T_SPRING && e === this.player) {
            e.vy = -8.7; e.grounded = false;
            Sfx.spring(); this.puff(e.x + e.w / 2, e.y + e.h, '#ff8a92', 6);
          }
        } else if (e.vy < 0) { e.y = (ty + 1) * TILE; e.vy = 0; }
        y1 = Math.floor(e.y / TILE); y2 = Math.floor((e.y + e.h - 1) / TILE);
      }
    }
  }
  for (i = 0; i < this.movers.length; i++) {
    m = this.movers[i];
    if (!Util.aabb(e, m)) continue;
    if (e.vy >= 0 && prevBottom <= m.y + 3) {
      e.y = m.y - e.h; e.vy = 0; e.grounded = true; e.riding = m;
    } else if (e.vy < 0 && prevTop >= m.y + m.h - 3) {
      e.y = m.y + m.h; e.vy = 0;
    }
  }
  if (!e.grounded && e.vy >= 0 && this.onGround(e)) e.grounded = true;
};

/* Is there footing directly under this actor? Checked separately from the
   collision snap: an actor resting exactly on a tile boundary does not
   overlap the floor tile, so the snap alone reports it as airborne and the
   grounded flag flickers frame to frame. */
World.prototype.onGround = function (e) {
  var probe = e.y + e.h + 1;
  var xl = e.x + 1, xr = e.x + e.w - 2;
  if (this.solidFor(e, this.codeAtPx(xl, probe)) ||
      this.solidFor(e, this.codeAtPx(xr, probe))) return true;
  for (var i = 0; i < this.movers.length; i++) {
    var m = this.movers[i];
    if (e.x + e.w > m.x && e.x < m.x + m.w &&
        e.y + e.h >= m.y - 2 && e.y + e.h <= m.y + 3) return true;
  }
  return false;
};

/* ---------------- spawning helpers ---------------- */
World.prototype.puff = function (x, y, color, n) {
  for (var i = 0; i < n; i++) {
    this.parts.push(new Particle(x, y, Util.rand(-1.5, 1.5), Util.rand(-1.8, 0.4),
      Util.randInt(14, 30), color, Math.random() < 0.3 ? 2 : 1));
  }
};
World.prototype.shake = function (n) { this.shakeAmt = Math.max(this.shakeAmt, n); };
World.prototype.dropCoin = function (x, y) {
  var p = new Pickup(x - 4, y - 4, 'coin');
  p.loose = true;
  p.vx = Util.rand(-1.2, 1.2); p.vy = Util.rand(-2.6, -1.2);
  this.pickups.push(p);
};
World.prototype.spawnEnemy = function (x, y, type) {
  var e = new Enemy(x, y, type, this.def.world);
  this.enemies.push(e);
  this.puff(x + 6, y + 6, '#c9a2f0', 8);
};
World.prototype.breakCrate = function (tx, ty) {
  if (this.tileAt(tx, ty) !== T_CRATE) return;
  this.tiles[ty][tx] = T_EMPTY;
  var cx = tx * TILE + 8, cy = ty * TILE + 8;
  Sfx.kill(); this.shake(3);
  for (var i = 0; i < 10; i++) {
    this.parts.push(new Particle(cx, cy, Util.rand(-2, 2), Util.rand(-2.6, 0.4),
      Util.randInt(18, 34), Util.pick(['#a97a45', '#c99a5f', '#5e3f21']), 2));
  }
  var n = Util.randInt(2, 4);
  for (var k = 0; k < n; k++) this.dropCoin(cx, cy);
};

World.prototype.onPlayerDead = function () {
  this.state = 'dying'; this.stateTimer = 96;
  Sfx.stopSong();
};
World.prototype.bossDefeated = function () {
  this.state = 'clear'; this.stateTimer = 90;
  Sfx.stopSong(); Sfx.fanfare();
  for (var i = 0; i < 26; i++) this.dropCoin(this.boss ? this.boss.x + 20 : 100, 60);
};

World.prototype.centerCamera = function () {
  var p = this.player;
  this.cam.x = Util.clamp(p.x + p.w / 2 - VIEW_W / 2, 0, Math.max(0, this.pixelW - VIEW_W));
  this.cam.y = Util.clamp(p.y + p.h / 2 - VIEW_H / 2 + 8, 0, Math.max(0, this.pixelH - VIEW_H));
};

/* ---------------- hazards & respawn ---------------- */
World.prototype.respawnPlayer = function () {
  var p = this.player;
  p.x = this.lastSafe.x; p.y = this.lastSafe.y - 2;
  p.vx = 0; p.vy = 0;
  p.invuln = 70;
  this.centerCamera();
};
World.prototype.hazardHit = function () {
  var p = this.player;
  if (p.invuln > 0 || p.dead) return;
  p.hp--;
  Sfx.hurt(); this.shake(6);
  this.puff(p.x + p.w / 2, p.y + p.h / 2, '#ffffff', 10);
  if (p.hp <= 0) { p.hp = 0; p.die(this); }
  else { this.respawnPlayer(); }
};

/* ---------------- main update ---------------- */
World.prototype.update = function () {
  this.t++;
  var p = this.player, i, e;

  if (this.hitStop > 0) { this.hitStop--; return; }
  if (this.bannerTimer > 0) this.bannerTimer--;
  if (this.shakeAmt > 0) this.shakeAmt = Math.max(0, this.shakeAmt - 0.6);

  /* moving platforms carry whatever stands on them */
  for (i = 0; i < this.movers.length; i++) {
    var m = this.movers[i];
    var stepX = m.dx * m.dir, stepY = m.dy * m.dir;
    m.mx += Math.abs(stepX) + Math.abs(stepY);
    if (m.mx >= m.span) { m.mx = 0; m.dir *= -1; }
    var riders = [p].concat(this.enemies);
    for (var r = 0; r < riders.length; r++) {
      var a = riders[r];
      if (a.dead) continue;
      var feet = a.y + a.h;
      if (feet >= m.y - 3 && feet <= m.y + 4 && a.x + a.w > m.x && a.x < m.x + m.w) {
        a.x += stepX; a.y += stepY;
      }
    }
    m.x += stepX; m.y += stepY;
  }

  if (this.state === 'play' || this.state === 'clear') {
    p.update(this);
  } else if (this.state === 'dying') {
    p.update(this);
    if (--this.stateTimer <= 0) { Game.onLevelFailed(); return; }
  }

  /* boss intro pause */
  if (this.bossIntro > 0) { this.bossIntro--; }

  if (this.state === 'play') {
    /* --- hazards & falling out of the world --- */
    if (p.y > this.pixelH + 20 && !p.dead) this.hazardHit();
    if (!p.dead) {
      var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
      var c = this.codeAtPx(cx, cy);
      var cFeet = this.codeAtPx(cx, p.y + p.h - 2);
      if (c === T_HAZ || cFeet === T_HAZ) this.hazardHit();
      else if (c === T_SPIKE || cFeet === T_SPIKE) {
        if (p.invuln <= 0) { p.hurt(this, cx); if (!p.dead) p.vy = -3.4; }
      }
      /* remember the last safe footing for respawns */
      if (p.grounded && p.vy === 0) {
        var below = this.codeAtPx(cx, p.y + p.h + 2);
        if (below === T_SOLID || below === T_PLAT) {
          this.lastSafe.x = p.x; this.lastSafe.y = p.y;
        }
      }
    }

    /* --- push into a false wall and it gives way --- */
    var fx0 = Math.floor(p.x / TILE), fx1 = Math.floor((p.x + p.w - 1) / TILE);
    var fy0 = Math.floor(p.y / TILE), fy1 = Math.floor((p.y + p.h - 1) / TILE);
    for (var fty = fy0; fty <= fy1; fty++) {
      for (var ftx = fx0; ftx <= fx1; ftx++) {
        if (this.tileAt(ftx, fty) !== T_FAKE) continue;
        var fkey = ftx + ',' + fty;
        if (this.revealed[fkey]) continue;
        this.revealed[fkey] = true;
        Sfx.spring();
        this.puff(ftx * TILE + 8, fty * TILE + 8, '#d8cbb8', 10);
        if (!this.secretShown) {
          this.secretShown = true;
          this.texts.push(new FloatText(p.x - 12, p.y - 10, 'SECRET FOUND', '#e8c45c'));
        }
      }
    }

    /* --- chests --- */
    for (i = 0; i < this.chests.length; i++) this.chests[i].update(this);

    /* --- the swing --- */
    var hb = p.hitbox();
    if (hb) {
      for (i = 0; i < this.enemies.length; i++) {
        e = this.enemies[i];
        if (e.dead || p.attackHit.indexOf(e) >= 0) continue;
        if (Util.aabb(hb, e)) {
          p.attackHit.push(e);
          e.hurt(p.damage(), p.facing, this);
          this.hitStop = 2;
          this.texts.push(new FloatText(e.x + e.w / 2 - 3, e.y - 4, String(p.damage()), '#ffe27a'));
        }
      }
      if (this.boss && !this.boss.dead && p.attackHit.indexOf(this.boss) < 0 &&
          Util.aabb(hb, this.boss) && this.boss.hurtLock <= 0) {
        p.attackHit.push(this.boss);
        this.boss.hurt(p.damage(), p.facing, this);
        this.hitStop = 3; this.shake(4);
      }
      for (i = 0; i < this.chests.length; i++) {
        if (!this.chests[i].open && Util.aabb(hb, this.chests[i])) this.chests[i].pop(this);
      }
      /* crates in the swing arc */
      var tx0 = Math.floor(hb.x / TILE), tx1 = Math.floor((hb.x + hb.w) / TILE);
      var ty0 = Math.floor(hb.y / TILE), ty1 = Math.floor((hb.y + hb.h) / TILE);
      for (var ty = ty0; ty <= ty1; ty++) {
        for (var tx = tx0; tx <= tx1; tx++) if (this.tileAt(tx, ty) === T_CRATE) this.breakCrate(tx, ty);
      }
      /* deflect incoming shots */
      for (i = 0; i < this.shots.length; i++) {
        var s = this.shots[i];
        if (s.kind !== 'shock' && Util.aabb(hb, s)) {
          s.dead = true;
          this.puff(s.x, s.y, '#ffe27a', 5);
        }
      }
    }
  }

  /* --- enemies --- */
  for (i = 0; i < this.enemies.length; i++) {
    e = this.enemies[i];
    if (e.dead) continue;
    if (this.state === 'play') e.update(this);
    if (this.state === 'play' && !p.dead && Util.aabb(p, e)) p.hurt(this, e.x + e.w / 2);
  }

  /* --- boss --- */
  if (this.boss && !this.boss.dead) {
    if (this.state === 'play' && this.bossIntro <= 0) this.boss.update(this);
    if (this.state === 'play' && !p.dead && !this.boss.contactHarmless() && Util.aabb(p, this.boss)) {
      p.hurt(this, this.boss.x + this.boss.w / 2);
    }
  }
  if (this.bossMelee) {
    if (this.state === 'play' && !p.dead && Util.aabb(p, this.bossMelee)) p.hurt(this, this.bossMelee.x + 8);
    if (--this.bossMelee.life <= 0) this.bossMelee = null;
  }

  /* --- shots --- */
  for (i = this.shots.length - 1; i >= 0; i--) {
    var sh = this.shots[i];
    sh.update(this);
    if (this.state === 'play' && !p.dead && Util.aabb(p, sh)) {
      p.hurt(this, sh.x + sh.w / 2);
      if (sh.kind !== 'shock') sh.dead = true;
    }
    if (sh.dead) this.shots.splice(i, 1);
  }

  /* --- pickups --- */
  for (i = this.pickups.length - 1; i >= 0; i--) {
    var pk = this.pickups[i];
    pk.update(this);
    if (!p.dead && Util.aabb(p, pk)) {
      if (pk.kind === 'coin') {
        var val = Save.has('lucky') ? 2 : 1;
        this.coinsRun += val; Save.addCoins(val);
        Sfx.coin();
      } else if (pk.kind === 'gem') {
        this.gemsGot++;
        Sfx.bone();
        this.texts.push(new FloatText(pk.x - 6, pk.y - 8, 'GEM ' + this.gemsGot + '/3', '#a8e0ff'));
        this.puff(pk.x + 3, pk.y + 3, '#a8e0ff', 14);
      } else {
        if (p.hp < p.maxHp) { p.hp++; this.texts.push(new FloatText(pk.x, pk.y - 6, '+1', '#e0424f')); }
        Sfx.buy();
      }
      this.pickups.splice(i, 1);
    }
  }

  /* --- door --- */
  if (this.state === 'play' && this.door && !p.dead && Util.aabb(p, this.door)) {
    this.state = 'clear'; this.stateTimer = 40;
    Sfx.stopSong(); Sfx.fanfare();
  }
  if (this.state === 'clear' && --this.stateTimer <= 0) { Game.onLevelClear(); return; }

  /* --- fx --- */
  for (i = this.parts.length - 1; i >= 0; i--) {
    this.parts[i].update();
    if (this.parts[i].life <= 0) this.parts.splice(i, 1);
  }
  for (i = this.texts.length - 1; i >= 0; i--) {
    this.texts[i].update();
    if (this.texts[i].life <= 0) this.texts.splice(i, 1);
  }
  for (i = this.enemies.length - 1; i >= 0; i--) if (this.enemies[i].dead) this.enemies.splice(i, 1);

  /* --- camera --- */
  var tx2 = Util.clamp(p.x + p.w / 2 - VIEW_W / 2 + p.facing * 14, 0, Math.max(0, this.pixelW - VIEW_W));
  var ty2 = Util.clamp(p.y + p.h / 2 - VIEW_H / 2 + 8, 0, Math.max(0, this.pixelH - VIEW_H));
  this.cam.x = Util.lerp(this.cam.x, tx2, 0.12);
  this.cam.y = Util.lerp(this.cam.y, ty2, 0.10);
};

/* ---------------- draw ---------------- */
/* Deterministic set dressing: ground clutter, hanging vines and
   wall torches, seeded off the stage id so it never shifts. */
World.prototype.buildDecor = function () {
  var id = this.def.id;
  var rnd = Util.seeded(id.charCodeAt(0) * 911 + id.charCodeAt(2) * 37 + 7);
  var P = Art.PROPS, theme = this.theme;
  var ground = theme === 'meadow'
      ? [P.TUFT, P.TUFT, P.TUFT, P.SHROOM, P.BARREL, P.RUBBLE]
      : theme === 'cavern'
      ? [P.CRYSTAL, P.CRYSTAL, P.SHROOM, P.RUBBLE, P.BONEPILE, P.SKULL]
      : [P.POT, P.SKULL, P.BARREL, P.VASE, P.RUBBLE, P.BONEPILE, P.CANDELABRA];
  var props = [], vines = [], torches = [], banners = [];
  var tx, ty;

  for (tx = 1; tx < this.cols - 1; tx++) {
    for (ty = 1; ty < this.rows; ty++) {
      var c = this.tileAt(tx, ty);
      if (c === T_PLAT && this.tileAt(tx, ty + 1) === T_EMPTY && rnd() < 0.20) {
        vines.push({ x: tx * TILE + 3 + Math.floor(rnd() * 9), y: ty * TILE + 6,
                     len: 5 + Math.floor(rnd() * 11), seed: rnd() * 6 });
      }
      if (!this.isSolidCode(c) || c === T_CRATE || c === T_SPRING) continue;
      if (this.tileAt(tx, ty - 1) !== T_EMPTY) continue;
      if (rnd() < 0.34) {
        var img = ground[Math.floor(rnd() * ground.length)];
        props.push({ img: img, x: tx * TILE + 1 + Math.floor(rnd() * 5), y: ty * TILE - img.height });
      }
      /* rubble banks up where the ground steps down */
      var drop = this.tileAt(tx + 1, ty) === T_EMPTY && this.isSolidCode(this.tileAt(tx, ty));
      if (drop && rnd() < 0.5) {
        props.push({ img: P.RUBBLE, x: tx * TILE + 6, y: ty * TILE - P.RUBBLE.height });
      }
      break;  /* only the topmost surface of each column */
    }
  }

  if (theme !== 'meadow') {
    for (tx = 3; tx < this.cols - 3; tx += 6 + Math.floor(rnd() * 5)) {
      for (ty = 2; ty < this.rows; ty++) {
        if (this.isSolidCode(this.tileAt(tx, ty)) && this.tileAt(tx, ty - 1) === T_EMPTY) {
          torches.push({ x: tx * TILE + 4, y: ty * TILE - 40, seed: Math.floor(rnd() * 9) });
          break;
        }
      }
    }
    if (theme === 'keep') {
      for (tx = 6; tx < this.cols - 6; tx += 17 + Math.floor(rnd() * 9)) {
        banners.push({ x: tx * TILE + 4, y: 14 + Math.floor(rnd() * 10) });
      }
    }
  }
  return { props: props, vines: vines, torches: torches, banners: banners };
};

World.prototype.draw = function (g) {
  var cam = { x: Math.round(this.cam.x), y: Math.round(this.cam.y) };
  var T = Art.THEMES[this.theme];
  Art.drawBackground(g, this.theme, cam.x, cam.y, this.t, VIEW_W, VIEW_H);

  g.save();
  if (this.shakeAmt > 0.2) {
    g.translate(Math.round(Util.rand(-this.shakeAmt, this.shakeAmt)),
                Math.round(Util.rand(-this.shakeAmt, this.shakeAmt)));
  }

  var i, ts = this.tileset;
  /* banners hang on the back wall, behind everything */
  for (i = 0; i < this.decor.banners.length; i++) {
    var bn = this.decor.banners[i];
    var bx = Math.round(bn.x - cam.x * 0.85), by = Math.round(bn.y - cam.y);
    if (bx > -20 && bx < VIEW_W + 20) {
      Art.drawChain(g, bx + 3, by - 8, 8);
      g.drawImage(Art.PROPS.BANNER, bx, by);
    }
  }
  /* torches sit on the wall behind the play surface */
  for (i = 0; i < this.decor.torches.length; i++) {
    var tc = this.decor.torches[i];
    var tcx = Math.round(tc.x - cam.x), tcy = Math.round(tc.y - cam.y);
    if (tcx > -20 && tcx < VIEW_W + 20) Art.drawTorch(g, tcx, tcy, this.t, tc.seed);
  }

  /* tiles */
  var x0 = Math.max(0, Math.floor(cam.x / TILE)), x1 = Math.min(this.cols - 1, Math.ceil((cam.x + VIEW_W) / TILE));
  var y0 = Math.max(0, Math.floor(cam.y / TILE)), y1 = Math.min(this.rows - 1, Math.ceil((cam.y + VIEW_H) / TILE));
  for (var ty = y0; ty <= y1; ty++) {
    for (var tx = x0; tx <= x1; tx++) {
      var c = this.tiles[ty][tx];
      if (c === T_EMPTY) continue;
      var dx = tx * TILE - cam.x, dy = ty * TILE - cam.y;
      if (c === T_SOLID || c === T_FAKE) {
        /* Autotiled masonry. A false wall uses the identical variant hash,
           depth shading and trim as the real thing, so nothing about it
           reads as different until you walk into it. */
        var found = (c === T_FAKE) && this.revealed[tx + ',' + ty];
        if (found) g.globalAlpha = 0.30;
        var openUp = !this.isWallLooking(this.tileAt(tx, ty - 1));
        g.drawImage(openUp ? Art.variant(ts.cap, tx, ty) : Art.variant(ts.solid, tx, ty), dx, dy);
        var dep = this.depth[ty][tx];
        if (dep > 0) {
          g.fillStyle = 'rgba(6,4,12,' + Math.min(0.62, dep * 0.17) + ')';
          g.fillRect(dx, dy, TILE, TILE);
        }
        if (!this.isWallLooking(this.tileAt(tx - 1, ty))) g.drawImage(ts.trimL[ty % 2], dx, dy);
        if (!this.isWallLooking(this.tileAt(tx + 1, ty))) g.drawImage(ts.trimR[ty % 2], dx, dy);
        if (!this.isWallLooking(this.tileAt(tx, ty + 1))) g.drawImage(ts.trimB, dx, dy);
        if (found) g.globalAlpha = 1;
      } else if (c === T_PLAT) {
        var pl = this.tileAt(tx - 1, ty) === T_PLAT, pr = this.tileAt(tx + 1, ty) === T_PLAT;
        g.drawImage(!pl ? ts.platL : (!pr ? ts.platR : ts.platM), dx, dy);
      }
      else if (c === T_SPIKE) g.drawImage(ts.spike, dx, dy);
      else if (c === T_HAZ) g.drawImage(ts.hazard[Math.floor(this.t / 12) % 3], dx, dy);
      else if (c === T_CRATE) g.drawImage(ts.crate, dx, dy);
      else if (c === T_SPRING) g.drawImage(ts.spring, dx, dy);
    }
  }

  /* ground clutter */
  for (i = 0; i < this.decor.props.length; i++) {
    var pr = this.decor.props[i];
    var prx = Math.round(pr.x - cam.x);
    if (prx > -20 && prx < VIEW_W + 20) g.drawImage(pr.img, prx, Math.round(pr.y - cam.y));
  }

  /* door */
  if (this.door) {
    g.drawImage(ts.door, Math.round(this.door.x - cam.x) - 4, Math.round(this.door.y - cam.y) - 6);
  }

  /* moving platforms */
  for (i = 0; i < this.movers.length; i++) {
    var m = this.movers[i];
    var mx = Math.round(m.x - cam.x), my = Math.round(m.y - cam.y);
    g.fillStyle = '#3a3448'; g.fillRect(mx, my, m.w, m.h);
    g.fillStyle = '#8d84a8'; g.fillRect(mx, my, m.w, 2);
    g.fillStyle = '#c9c0dd'; g.fillRect(mx, my, m.w, 1);
    g.fillStyle = '#1b1826'; g.fillRect(mx, my + m.h - 1, m.w, 1);
    g.fillStyle = '#e8c45c'; g.fillRect(mx + 1, my + 2, 1, 1); g.fillRect(mx + m.w - 2, my + 2, 1, 1);
  }

  for (i = 0; i < this.chests.length; i++) this.chests[i].draw(g, cam);
  for (i = 0; i < this.pickups.length; i++) this.pickups[i].draw(g, cam);
  for (i = 0; i < this.enemies.length; i++) this.enemies[i].draw(g, cam);
  if (this.boss && !this.boss.dead) this.boss.draw(g, cam);
  for (i = 0; i < this.shots.length; i++) this.shots[i].draw(g, cam);
  this.player.draw(g, cam);
  for (i = 0; i < this.parts.length; i++) this.parts[i].draw(g, cam);

  /* vines hang in front of the platforms they grow on */
  for (i = 0; i < this.decor.vines.length; i++) {
    var v = this.decor.vines[i];
    var vx = Math.round(v.x - cam.x);
    if (vx > -8 && vx < VIEW_W + 8) Art.drawVine(g, vx, Math.round(v.y - cam.y), v.len, this.t, v.seed);
  }
  for (i = 0; i < this.texts.length; i++) this.texts[i].draw(g, cam);

  Art.drawMotes(g, this.theme, cam.x, cam.y, this.t, VIEW_W, VIEW_H);
  Art.drawForeground(g, this.theme, cam.x, cam.y, this.t, VIEW_W, VIEW_H);

  g.restore();

  /* ---- lighting ---- */
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (i = 0; i < this.decor.torches.length; i++) {
    var lt = this.decor.torches[i];
    var lx = Math.round(lt.x - cam.x), ly = Math.round(lt.y - cam.y) + 4;
    if (lx > -60 && lx < VIEW_W + 60) {
      var flick = 40 + Math.sin(this.t * 0.2 + lt.seed) * 3;
      Art.light(g, lx + 2, ly, flick, T.glow);
    }
  }
  if (this.door) {
    Art.light(g, this.door.x - cam.x + 8, this.door.y - cam.y + 16, 34, 'rgba(255,220,140,.5)');
  }
  g.restore();
  Art.vignette(g, VIEW_W, VIEW_H, Art.THEMES[this.theme].vignette);

  this.drawHud(g);
};

World.prototype.drawHud = function (g) {
  var p = this.player, i;
  /* hearts */
  for (i = 0; i < p.maxHp; i++) {
    g.drawImage(i < p.hp ? Art.HEART_FULL : Art.HEART_EMPTY, 6 + i * 10, 6);
  }
  /* coins */
  g.drawImage(Art.COIN, VIEW_W - 52, 5);
  Text.shadow(g, String(Save.get().coins), VIEW_W - 42, 6, '#ffe27a', 1);
  /* gems found this run, then chests */
  var gem = Art.GEMS[this.theme] || Art.GEMS.meadow;
  for (i = 0; i < 3; i++) {
    var gx = VIEW_W - 82 + i * 9;
    if (i < this.gemsGot) g.drawImage(gem, gx, 17);
    else {
      g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(gx + 1, 18, 5, 5);
      g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(gx + 1, 18, 5, 1);
    }
  }
  for (i = 0; i < 2; i++) {
    var kx = VIEW_W - 50 + i * 11;
    g.save();
    if (i >= this.chestsGot) g.globalAlpha = 0.30;
    g.drawImage(Art.CHEST, kx, 15, 10, 9);
    g.restore();
  }

  /* boss bar */
  if (this.boss && !this.boss.dead) {
    var bw = 160, bx = (VIEW_W - bw) / 2, by = VIEW_H - 14;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(bx - 2, by - 2, bw + 4, 10);
    g.fillStyle = '#3a2030'; g.fillRect(bx, by, bw, 6);
    var frac = Math.max(0, this.boss.hp / this.boss.maxHp);
    g.fillStyle = this.boss.phase === 2 ? '#ff6b4a' : '#e0424f';
    g.fillRect(bx, by, Math.round(bw * frac), 6);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(bx, by, Math.round(bw * frac), 1);
    Text.centerShadow(g, this.boss.name, VIEW_W / 2, by - 11, '#ffd0c0', 1);
  }

  /* stage banner */
  if (this.bannerTimer > 0) {
    var a = Math.min(1, this.bannerTimer / 40);
    g.save(); g.globalAlpha = a;
    Text.centerShadow(g, this.def.id + '  ' + this.def.name, VIEW_W / 2, 30, '#ffffff', 1);
    if (this.def.hint) Text.centerShadow(g, this.def.hint, VIEW_W / 2, 42, '#c9c0e0', 1);
    g.restore();
  }

  if (this.state === 'dying') {
    g.fillStyle = 'rgba(10,6,14,' + Math.min(0.75, (96 - this.stateTimer) / 96) + ')';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
};

/* ===== ui.js ===== */
/* Menus, map screen, shop and result screens. */
var UI = (function () {
  function panel(g, x, y, w, h, fill) {
    g.fillStyle = fill || 'rgba(14,10,22,.88)';
    g.fillRect(x, y, w, h);
    g.fillStyle = '#6b5a8a'; g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1);
    g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h);
    g.fillStyle = '#39304f';
    g.fillRect(x + 1, y + 1, w - 2, 1); g.fillRect(x + 1, y + h - 2, w - 2, 1);
  }
  function dim(g, a) {
    g.fillStyle = 'rgba(8,5,14,' + a + ')';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  function cursor(g, x, y, t) {
    var off = Math.round(Math.sin(t * 0.14) * 1.4);
    g.fillStyle = '#ffd75e';
    g.fillRect(x + off, y + 1, 2, 5);
    g.fillRect(x + off + 2, y + 2, 2, 3);
    g.fillRect(x + off + 4, y + 3, 1, 1);
  }

  /* Decorative starfield shared by the menu screens. */
  var stars = [];
  for (var i = 0; i < 46; i++) {
    stars.push({ x: Math.random() * VIEW_W, y: Math.random() * VIEW_H,
                 s: Math.random() < 0.25 ? 2 : 1, p: Math.random() * 6.28 });
  }
  function backdrop(g, t, tint) {
    var grad = g.createLinearGradient(0, 0, 0, VIEW_H);
    grad.addColorStop(0, tint ? tint[0] : '#140f22');
    grad.addColorStop(1, tint ? tint[1] : '#2a1836');
    g.fillStyle = grad; g.fillRect(0, 0, VIEW_W, VIEW_H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      g.globalAlpha = 0.25 + 0.45 * Math.abs(Math.sin(t * 0.02 + s.p));
      g.fillStyle = '#ffe9c0';
      g.fillRect(s.x, s.y, s.s, s.s);
    }
    g.globalAlpha = 1;
  }

  /* ------------------------------------------------ TITLE */
  var title = {
    update: function (G) {
      if (Input.pressed('confirm') || Input.pressed('jump') || Input.pressed('attack')) {
        Sfx.confirm();
        G.go('map');
      }
    },
    draw: function (g, G) {
      backdrop(g, G.t);
      /* rolling hills */
      g.fillStyle = '#1b1328';
      for (var x = 0; x < VIEW_W; x++) {
        var h = Math.floor(16 + 7 * Math.sin(x * 0.02) + 4 * Math.sin(x * 0.06 + 2));
        g.fillRect(x, VIEW_H - h, 1, h);
      }
      var cx = VIEW_W / 2;
      Text.centerShadow(g, 'BUDDY', cx, 34, '#ffffff', 3);
      Text.centerShadow(g, 'BLADE', cx, 62, '#ffd75e', 3);
      Text.centerShadow(g, 'A GOOD BOY WITH A VERY SHARP STICK', cx, 90, '#b8a8d8', 1);

      /* hero idles on the title, blade out */
      var bob = Math.round(Math.sin(G.t * 0.06) * 2);
      var px = Math.round(cx - 18), py = 124 + bob;
      g.save();
      g.imageSmoothingEnabled = false;
      g.drawImage(Art.dog.right.idle, px, py, 36, 28);
      g.restore();
      Art.drawBlade(g, px + 30, py + 17, -0.5 + Math.sin(G.t * 0.05) * 0.12, Save.get().sword, 1);

      if (Math.floor(G.t / 26) % 2 === 0) {
        Text.centerShadow(g, 'PRESS ENTER', cx, VIEW_H - 32, '#ffffff', 1);
      }
      Text.centerShadow(g, 'ARROWS MOVE   Z JUMP   X SWING   M MUTE', cx, VIEW_H - 16, '#8d80ad', 1);
    }
  };

  /* ------------------------------------------------ WORLD MAP */
  function nodePos(i) {
    var w = Math.floor(i / 4), s = i % 4;
    var step = Math.floor((VIEW_W - 104) / 3);
    return { x: 52 + s * step, y: 62 + w * 44 };
  }
  var map = {
    update: function (G) {
      var d = Save.get();
      var max = Math.min(d.unlocked, LEVELS.length) - 1;
      var moved = 0;
      if (Input.pressed('right')) moved = 1;
      else if (Input.pressed('left')) moved = -1;
      else if (Input.pressed('down')) moved = 4;
      else if (Input.pressed('up')) moved = -4;
      if (moved) {
        var n = Util.clamp(G.sel + moved, 0, max);
        if (n !== G.sel) { G.sel = n; Sfx.select(); }
        else Sfx.deny();
      }
      if (Input.pressed('confirm') || Input.pressed('jump')) {
        Sfx.confirm(); G.startStage(G.sel);
      }
      if (Input.pressed('attack')) { Sfx.confirm(); G.go('shop'); }
      if (Input.pressed('pause')) { Sfx.select(); G.go('title'); }
    },
    draw: function (g, G) {
      backdrop(g, G.t, ['#121b2a', '#26183a']);
      var d = Save.get();
      Text.centerShadow(g, 'THE LONG WALK', VIEW_W / 2, 14, '#ffffff', 2);

      /* world bands */
      for (var w = 0; w < 3; w++) {
        var y = 62 + w * 44;
        g.fillStyle = 'rgba(255,255,255,.05)';
        g.fillRect(16, y - 14, VIEW_W - 32, 34);
        Text.draw(g, WORLDS[w].name, 20, y - 12, '#7f72a0', 1);
      }
      /* connecting track */
      for (var i = 0; i < LEVELS.length - 1; i++) {
        if (Math.floor(i / 4) !== Math.floor((i + 1) / 4)) continue;
        var a = nodePos(i), b = nodePos(i + 1);
        for (var x = a.x + 12; x < b.x; x += 5) {
          g.fillStyle = (i + 1 < d.unlocked) ? '#6b5a8a' : '#342b47';
          g.fillRect(x, a.y + 5, 2, 2);
        }
      }
      /* nodes */
      for (i = 0; i < LEVELS.length; i++) {
        var L = LEVELS[i], p = nodePos(i);
        var open = i < d.unlocked;
        var done = !!d.cleared[L.id];
        var isBoss = !!L.boss;
        g.fillStyle = open ? (done ? '#3f7a52' : (isBoss ? '#7a2d3f' : '#3c3558')) : '#241f33';
        g.fillRect(p.x, p.y, 24, 14);
        g.fillStyle = open ? (isBoss ? '#e0424f' : '#8d80ad') : '#3a3350';
        g.fillRect(p.x, p.y, 24, 1); g.fillRect(p.x, p.y + 13, 24, 1);
        g.fillRect(p.x, p.y, 1, 14); g.fillRect(p.x + 23, p.y, 1, 14);
        Text.draw(g, open ? L.id : '??', p.x + 5, p.y + 4, open ? '#ffffff' : '#5a5170', 1);
        if (!isBoss && open) {
          var got = d.gems[L.id] || 0;
          var gimg = Art.GEMS[L.theme] || Art.GEMS.meadow;
          for (var gI = 0; gI < 3; gI++) {
            if (gI < got) g.drawImage(gimg, p.x + 26 + gI * 8, p.y + 4);
            else { g.fillStyle = '#3a3350'; g.fillRect(p.x + 27 + gI * 8, p.y + 5, 5, 5); }
          }
        }
        if (done) { g.fillStyle = '#7fe0a0'; g.fillRect(p.x + 2, p.y + 2, 2, 2); }
      }
      var sp = nodePos(G.sel);
      cursor(g, sp.x - 10, sp.y + 4, G.t);

      /* selected stage info */
      var L2 = LEVELS[G.sel];
      panel(g, 8, VIEW_H - 44, VIEW_W - 16, 36);
      Text.draw(g, L2.id + ' ' + L2.name, 16, VIEW_H - 38, '#ffd75e', 1);
      Text.draw(g, 'COINS ' + d.coins + '   GEMS ' + Save.gemsFound() + '/' + Save.gemsTotal() +
        '   CHESTS ' + Save.chestsFound(), 16, VIEW_H - 27, '#b8a8d8', 1);
      Text.draw(g, 'ENTER PLAY   X SHOP', VIEW_W - 130, VIEW_H - 16, '#7f72a0', 1);
    }
  };

  /* ------------------------------------------------ SHOP */
  var shop = {
    update: function (G) {
      var list = Save.SHOP;
      if (Input.pressed('down')) { G.shopSel = (G.shopSel + 1) % list.length; Sfx.select(); }
      if (Input.pressed('up')) { G.shopSel = (G.shopSel + list.length - 1) % list.length; Sfx.select(); }
      if (Input.pressed('confirm') || Input.pressed('jump')) {
        var it = list[G.shopSel];
        if (Save.buy(it)) {
          Sfx.buy();
          G.shopMsg = 'BOUGHT ' + it.name + '!'; G.shopMsgT = 100;
        } else {
          Sfx.deny();
          G.shopMsg = Save.owned(it) ? 'ALREADY YOURS' :
            (!Save.available(it) ? 'BUY THE EARLIER TIER FIRST' : 'NOT ENOUGH COIN');
          G.shopMsgT = 100;
        }
      }
      if (Input.pressed('pause') || Input.pressed('attack')) { Sfx.select(); G.go('map'); }
    },
    draw: function (g, G) {
      backdrop(g, G.t, ['#201428', '#3a1f2f']);
      Text.centerShadow(g, 'THE TRADING POST', VIEW_W / 2, 10, '#ffffff', 2);
      g.drawImage(Art.COIN, 10, 10);
      Text.draw(g, String(Save.get().coins), 21, 11, '#ffe27a', 1);

      var list = Save.SHOP;
      var top = Util.clamp(G.shopSel - 3, 0, Math.max(0, list.length - 7));
      var listW = Math.round(VIEW_W * 0.60), detX = listW + 18;
      panel(g, 10, 30, listW, 150);
      for (var i = 0; i < 7 && top + i < list.length; i++) {
        var it = list[top + i], y = 37 + i * 19;
        var own = Save.owned(it), avail = Save.available(it);
        var col = own ? '#5f7a5f' : (avail && Save.get().coins >= it.cost ? '#ffffff' : '#8d80ad');
        if (top + i === G.shopSel) {
          g.fillStyle = 'rgba(255,215,94,.14)';
          g.fillRect(12, y - 4, listW - 4, 17);
          cursor(g, 14, y, G.t);
        }
        Text.draw(g, it.name, 24, y, col, 1);
        Text.draw(g, own ? 'OWNED' : String(it.cost), listW - 46, y, own ? '#7fe0a0' : '#ffd75e', 1);
      }

      /* detail card */
      panel(g, detX, 30, VIEW_W - detX - 10, 150);
      var sel = list[G.shopSel];
      Text.draw(g, sel.kind === 'sword' ? 'BLADE' : (sel.kind === 'collar' ? 'COLLAR' : 'RELIC'),
        detX + 8, 38, '#7f72a0', 1);
      /* wrap the description */
      var words = sel.desc.split(' '), line = '', ly = 54;
      for (var wI = 0; wI < words.length; wI++) {
        var tryLine = line ? line + ' ' + words[wI] : words[wI];
        if (Text.width(tryLine, 1) > VIEW_W - detX - 26) { Text.draw(g, line, detX + 8, ly, '#d8cff0', 1); ly += 11; line = words[wI]; }
        else line = tryLine;
      }
      if (line) Text.draw(g, line, detX + 8, ly, '#d8cff0', 1);

      if (sel.kind === 'sword') {
        Art.drawBlade(g, detX + 26, 152, -0.5, sel.tier, 1);
      } else if (sel.kind === 'collar') {
        for (var h = 0; h < 3 + sel.tier; h++) g.drawImage(Art.HEART_FULL, detX + 8 + h * 11, 146);
      } else {
        g.drawImage(Art.BONE_GOLD, detX + 20, 148);
      }

      if (G.shopMsgT > 0) {
        Text.centerShadow(g, G.shopMsg, VIEW_W / 2, VIEW_H - 22, '#ffd75e', 1);
        G.shopMsgT--;
      }
      Text.draw(g, 'ENTER BUY    X BACK', 10, VIEW_H - 12, '#7f72a0', 1);
    }
  };

  /* ------------------------------------------------ PAUSE */
  function pauseItems() {
    var items = [
      { k: 'resume', label: 'RESUME' },
      { k: 'restart', label: 'RESTART STAGE' },
      { k: 'sound', label: 'SOUND',
        value: function () { return Sfx.isEnabled() ? 'ON' : 'OFF'; } }
    ];
    /* only worth offering once the screen has actually been touched */
    if (Input.mode() === 'touch') {
      items.push({ k: 'touch', label: 'TOUCH PAD',
        value: function () { return Input.touchMode() === 'always' ? 'ALWAYS ON' : 'AUTO HIDE'; } });
    }
    items.push({ k: 'quit', label: 'QUIT TO MAP' });
    return items;
  }

  var pause = {
    update: function (G) {
      var items = pauseItems();
      if (G.pauseSel >= items.length) G.pauseSel = 0;

      if (Input.pressed('down')) { G.pauseSel = (G.pauseSel + 1) % items.length; Sfx.select(); }
      if (Input.pressed('up')) { G.pauseSel = (G.pauseSel + items.length - 1) % items.length; Sfx.select(); }

      var it = items[G.pauseSel];
      var nudge = Input.pressed('left') ? -1 : (Input.pressed('right') ? 1 : 0);
      if (nudge && it.value) {
        if (it.k === 'sound') {
          var d = Save.get();
          d.sound = !Sfx.isEnabled();
          Sfx.setEnabled(d.sound);
          Save.flush();
          if (d.sound && G.world) Sfx.playSong(G.world.def.boss ? 'boss' : G.world.theme);
        } else if (it.k === 'touch') {
          var d2 = Save.get();
          d2.touchMode = (Input.touchMode() === 'always') ? 'auto' : 'always';
          Input.setTouchMode(d2.touchMode);
          Save.flush();
        }
        Sfx.select();
      }

      if (Input.pressed('confirm') || Input.pressed('jump')) {
        if (it.k === 'resume') { Sfx.select(); G.state = 'play'; }
        else if (it.k === 'restart') { Sfx.confirm(); G.startStage(G.world.index); }
        else if (it.k === 'quit') { Sfx.select(); G.go('map'); }
        else Sfx.select();
      }
      if (Input.pressed('pause')) { Sfx.select(); G.state = 'play'; }
      if (Input.pressed('restart')) { Sfx.confirm(); G.startStage(G.world.index); }
    },
    draw: function (g, G) {
      G.world.draw(g);
      dim(g, 0.72);
      var items = pauseItems();
      var w = 214, h = 48 + items.length * 18;
      var x = Math.round(VIEW_W / 2 - w / 2), y = Math.round(VIEW_H / 2 - h / 2);
      panel(g, x, y, w, h);
      Text.centerShadow(g, 'PAUSED', VIEW_W / 2, y + 10, '#ffffff', 2);

      for (var i = 0; i < items.length; i++) {
        var iy = y + 32 + i * 18;
        var on = i === G.pauseSel;
        if (on) {
          g.fillStyle = 'rgba(255,215,94,.12)';
          g.fillRect(x + 6, iy - 5, w - 12, 16);
          cursor(g, x + 10, iy - 1, G.t);
        }
        Text.draw(g, items[i].label, x + 24, iy, on ? '#ffffff' : '#9d92b8', 1);
        if (items[i].value) {
          var v = items[i].value();
          Text.draw(g, '<', x + w - 86, iy, on ? '#ffd75e' : '#5d5478', 1);
          Text.draw(g, v, x + w - 76, iy, on ? '#ffd75e' : '#7f72a0', 1);
          Text.draw(g, '>', x + w - 14, iy, on ? '#ffd75e' : '#5d5478', 1);
        }
      }
      Text.center(g, 'INPUT: ' + Input.schemeLabel(), VIEW_W / 2, y + h - 12, '#6d6488', 1);
    }
  };

  /* ------------------------------------------------ RESULTS */
  var clear = {
    update: function (G) {
      if (G.resultT > 0) { G.resultT--; return; }
      if (Input.pressed('confirm') || Input.pressed('jump') || Input.pressed('attack')) {
        Sfx.confirm();
        if (Save.allCleared() && G.lastStage === LEVELS.length - 1) G.go('ending');
        else G.go('map');
      }
    },
    draw: function (g, G) {
      backdrop(g, G.t, ['#16241c', '#243a26']);
      Text.centerShadow(g, 'STAGE CLEAR', VIEW_W / 2, 32, '#ffd75e', 2);
      panel(g, VIEW_W / 2 - 110, 64, 220, 88);
      var px0 = VIEW_W / 2 - 96, pv = VIEW_W / 2 - 34;
      Text.draw(g, 'STAGE', px0, 76, '#8d80ad', 1);
      Text.draw(g, LEVELS[G.lastStage].name, pv, 76, '#ffffff', 1);
      Text.draw(g, 'COIN', px0, 94, '#8d80ad', 1);
      g.drawImage(Art.COIN, pv - 2, 93);
      Text.draw(g, '+' + G.resultCoins, pv + 10, 94, '#ffe27a', 1);
      Text.draw(g, 'GEMS', px0, 112, '#8d80ad', 1);
      var rg = Art.GEMS[LEVELS[G.lastStage].theme] || Art.GEMS.meadow;
      for (var gI = 0; gI < 3; gI++) {
        if (gI < G.resultGems) g.drawImage(rg, pv - 2 + gI * 9, 111);
        else { g.fillStyle = '#332b44'; g.fillRect(pv - 1 + gI * 9, 112, 5, 5); }
      }
      Text.draw(g, G.resultChests + ' CHEST' + (G.resultChests === 1 ? '' : 'S'),
        pv + 30, 112, G.resultChests ? '#e8c45c' : '#6b6458', 1);
      Text.draw(g, 'PURSE', px0, 130, '#8d80ad', 1);
      Text.draw(g, String(Save.get().coins), pv, 130, '#ffe27a', 1);
      if (G.resultT <= 0 && Math.floor(G.t / 24) % 2 === 0) {
        Text.center(g, 'PRESS ENTER', VIEW_W / 2, VIEW_H - 22, '#ffffff', 1);
      }
    }
  };

  var fail = {
    update: function (G) {
      if (G.resultT > 0) { G.resultT--; return; }
      if (Input.pressed('confirm') || Input.pressed('jump')) { Sfx.confirm(); G.startStage(G.lastStage); }
      if (Input.pressed('attack') || Input.pressed('pause')) { Sfx.select(); G.go('map'); }
    },
    draw: function (g, G) {
      backdrop(g, G.t, ['#1c1016', '#331823']);
      Text.centerShadow(g, 'DOWN BOY', VIEW_W / 2, 52, '#e0424f', 3);
      g.drawImage(Art.dog.right.sit, VIEW_W / 2 - 18, 96, 36, 28);
      Text.center(g, 'THE COIN YOU PICKED UP IS KEPT.', VIEW_W / 2, 140, '#b8a8d8', 1);
      if (G.resultT <= 0) {
        Text.center(g, 'ENTER  TRY AGAIN', VIEW_W / 2, 164, '#ffffff', 1);
        Text.center(g, 'X      BACK TO MAP', VIEW_W / 2, 178, '#8d80ad', 1);
      }
    }
  };

  var ending = {
    update: function (G) {
      if (Input.pressed('confirm') || Input.pressed('pause')) { Sfx.confirm(); G.go('title'); }
    },
    draw: function (g, G) {
      backdrop(g, G.t, ['#101a2a', '#2a1f3a']);
      Text.centerShadow(g, 'GOOD DOG', VIEW_W / 2, 30, '#ffd75e', 3);
      Text.center(g, 'THE KEEP IS QUIET. THE GARDEN IS SAFE.', VIEW_W / 2, 70, '#d8cff0', 1);
      Text.center(g, 'YOU HAVE EARNED THE NAP.', VIEW_W / 2, 84, '#d8cff0', 1);
      var bob = Math.round(Math.sin(G.t * 0.05) * 2);
      g.drawImage(Art.dog.right.sit, VIEW_W / 2 - 18, 106 + bob, 36, 28);
      Text.center(g, 'GEMS  ' + Save.gemsFound() + ' / ' + Save.gemsTotal() +
        '     CHESTS  ' + Save.chestsFound(), VIEW_W / 2, 152, '#a8e0ff', 1);
      Text.center(g, 'COIN IN THE PURSE  ' + Save.get().coins, VIEW_W / 2, 166, '#ffe27a', 1);
      if (Math.floor(G.t / 26) % 2 === 0) {
        Text.center(g, 'PRESS ENTER', VIEW_W / 2, VIEW_H - 16, '#ffffff', 1);
      }
    }
  };

  return { title: title, map: map, shop: shop, pause: pause,
           clear: clear, fail: fail, ending: ending, panel: panel, dim: dim, backdrop: backdrop };
})();

/* ===== game.js ===== */
/* Boot, scaling, fixed-step loop and the screen state machine. */
var Game = (function () {
  var cv, g, acc = 0, last = 0;
  var STEP = 1000 / 60;

  var G = {
    state: 'title',
    prevState: null,
    world: null,
    sel: 0,
    shopSel: 0,
    pauseSel: 0,
    shopMsg: '', shopMsgT: 0,
    t: 0,
    lastStage: 0,
    resultCoins: 0,
    resultGems: 0,
    resultChests: 0,
    resultT: 0,
    fade: 0,          /* 0 = clear, 1 = black */
    fadeDir: 0,
    pending: null
  };

  /* The design reference is 400x224. Rather than pinning one axis and
     letting the other go short, the view is scaled so that reference
     ALWAYS fits, then whichever axis has room shows more world. A 4:3
     screen therefore gets the full width plus extra height instead of a
     cramped, narrow picture, and an ultrawide gets extra width. Pixels
     stay square in every case, and the picture fills the display. */
  var BASE_W = 400, BASE_H = 224;

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (!vw || !vh) return;

    var scale = Math.min(vw / BASE_W, vh / BASE_H);
    var w = Math.round(vw / scale / 2) * 2;
    var h = Math.round(vh / scale / 2) * 2;
    VIEW_W = Math.max(BASE_W, Math.min(760, w));
    VIEW_H = Math.max(BASE_H, Math.min(440, h));

    if (cv.width !== VIEW_W || cv.height !== VIEW_H) {
      cv.width = VIEW_W;
      cv.height = VIEW_H;
    }
    g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;

    /* one uniform scale for both axes - never stretched */
    var s2 = Math.min(vw / VIEW_W, vh / VIEW_H);
    cv.style.width = Math.round(VIEW_W * s2) + 'px';
    cv.style.height = Math.round(VIEW_H * s2) + 'px';
  }

  G.go = function (state) {
    G.pending = state;
    G.fadeDir = 1;
  };
  function enter(state) {
    G.prevState = G.state;
    G.state = state;
    if (state === 'map') { Sfx.stopSong(); }
    if (state === 'title') { Sfx.stopSong(); }
  }

  G.startStage = function (index) {
    G.lastStage = index;
    G.pending = 'play';
    G.pendingStage = index;
    G.fadeDir = 1;
  };

  G.onLevelClear = function () {
    var w = G.world;
    G.resultCoins = w.coinsRun;
    G.resultGems = w.gemsGot;
    G.resultChests = w.chestsGot;
    G.resultT = 26;
    Save.clearStage(w.index, w.gemsGot, w.chestsGot);
    Save.flush();
    G.go('clear');
  };
  G.onLevelFailed = function () {
    G.resultT = 30;
    Save.flush();
    G.go('fail');
  };

  function screen() {
    switch (G.state) {
      case 'title': return UI.title;
      case 'map': return UI.map;
      case 'shop': return UI.shop;
      case 'pause': return UI.pause;
      case 'clear': return UI.clear;
      case 'fail': return UI.fail;
      case 'ending': return UI.ending;
    }
    return null;
  }

  function update() {
    G.t++;
    Input.pollPad();
    Sfx.tick();

    if (Input.pressed('mute')) {
      var d = Save.get();
      d.sound = !d.sound;
      Sfx.setEnabled(d.sound);
      Save.flush();
      if (d.sound && G.state === 'play' && G.world) {
        Sfx.playSong(G.world.def.boss ? 'boss' : G.world.theme);
      }
    }

    /* screen transition */
    if (G.fadeDir === 1) {
      G.fade = Math.min(1, G.fade + 0.12);
      if (G.fade >= 1) {
        if (G.pending === 'play') {
          G.world = new World(G.pendingStage != null ? G.pendingStage : G.lastStage);
          G.pendingStage = null;
          enter('play');
        } else if (G.pending) enter(G.pending);
        G.pending = null;
        G.fadeDir = -1;
      }
      Input.endFrame();
      return;
    } else if (G.fadeDir === -1) {
      G.fade = Math.max(0, G.fade - 0.1);
      if (G.fade <= 0) G.fadeDir = 0;
    }

    if (G.state === 'play') {
      if (Input.pressed('pause')) { Sfx.select(); G.state = 'pause'; }
      else if (Input.pressed('restart')) { Sfx.confirm(); G.startStage(G.world.index); }
      else G.world.update();
    } else {
      var s = screen();
      if (s) s.update(G);
    }
    Input.endFrame();
  }

  function draw() {
    g.imageSmoothingEnabled = false;
    if (G.state === 'play' && G.world) G.world.draw(g);
    else {
      var s = screen();
      if (s) s.draw(g, G);
    }
    if (G.fade > 0) {
      g.fillStyle = 'rgba(6,4,10,' + G.fade + ')';
      g.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(now - last, 250);
    last = now;
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard++ < 5) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }

  function boot() {
    cv = document.getElementById('screen');
    g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    Save.load();
    Sfx.setEnabled(Save.get().sound !== false);
    Input.init();
    Input.setTouchMode(Save.get().touchMode || 'auto');
    fitCanvas();
    window.addEventListener('resize', fitCanvas);
    /* audio contexts need a gesture before they will make noise */
    var wake = function () { Sfx.resume(); };
    window.addEventListener('keydown', wake, { once: true });
    window.addEventListener('pointerdown', wake, { once: true });
    /* start the cursor on the newest unlocked stage */
    G.sel = Util.clamp(Save.get().unlocked - 1, 0, LEVELS.length - 1);
    requestAnimationFrame(frame);
  }

  G.boot = boot;
  return G;
})();
window.addEventListener('DOMContentLoaded', Game.boot);

  </script>
</body>
