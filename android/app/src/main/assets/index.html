<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buddy Blade">
<title>Buddy Blade</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; background:#07060a; overflow:hidden;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none; touch-action:none;
}
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#screen {
  image-rendering: pixelated; image-rendering: crisp-edges;
  background:#0b0a12; display:block;
  box-shadow: 0 0 0 2px #1b1826, 0 10px 50px rgba(0,0,0,.8);
}

/* ---- touch controls: invisible until the screen is actually touched,
        so keyboard and gamepad players never see them ---- */
#touch { position:fixed; inset:0; pointer-events:none; z-index:5;
         transition:opacity .25s ease; }
#touch.hidden { display:none; }
/* faded while your thumb is off the glass - still live, so a tap brings
   it straight back */
#touch.idle #stick, #touch.idle .acts { opacity:0; }
#touch.idle .sys { opacity:.30; }
#stick, .acts, .sys { transition:opacity .25s ease; }

/* the left half is a catch area; the stick springs up wherever you press */
#stickzone {
  position:absolute; left:0; top:0; bottom:0; width:50%;
  pointer-events:auto; touch-action:none;
}
#stick {
  position:absolute; width:116px; height:116px; margin:-58px 0 0 -58px;
  border-radius:50%; border:2px solid rgba(150,135,190,.42);
  background:radial-gradient(circle at 50% 50%, rgba(40,32,60,.42), rgba(20,16,32,.30));
  opacity:0; transition:opacity .12s ease; pointer-events:none;
}
#stick.live { opacity:1; }
#knob {
  position:absolute; left:50%; top:50%; width:52px; height:52px;
  margin:-26px 0 0 -26px; border-radius:50%;
  border:2px solid rgba(203,189,240,.85);
  background:radial-gradient(circle at 40% 35%, rgba(150,130,205,.95), rgba(70,56,112,.9));
  box-shadow:0 2px 10px rgba(0,0,0,.45);
}
#touch .acts {
  position:absolute; right:calc(16px + env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex; gap:12px; align-items:flex-end; pointer-events:auto;
}
.tbtn {
  border-radius:50%; border:2px solid rgba(150,135,190,.55);
  background:rgba(24,20,36,.55); color:#e6dcf7;
  font:700 12px/1 ui-monospace,monospace; touch-action:none;
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center;
}
.tbtn:active { background:rgba(120,100,175,.85); border-color:#cbbdf0; transform:translateY(1px); }
.act { width:84px; height:84px; }
.jmp { background:rgba(58,40,96,.62); }
.atk { background:rgba(96,36,48,.62); margin-bottom:26px; }
.sys {
  position:absolute; top:calc(10px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  width:44px; height:40px; border-radius:14px; font-size:13px;
  pointer-events:auto; opacity:.7;
}
@media (max-height:420px) {
  .act { width:72px; height:72px; }
  #stick { width:100px; height:100px; margin:-50px 0 0 -50px; }
}
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="screen" width="400" height="224"></canvas>
    <div id="touch" class="hidden">
      <div id="stickzone"></div>
      <div id="stick"><div id="knob"></div></div>
      <div class="acts">
        <button class="tbtn act atk" data-key="attack" aria-label="Swing">SWING</button>
        <button class="tbtn act jmp" data-key="jump" aria-label="Jump">JUMP</button>
      </div>
      <button class="tbtn sys" data-key="pause" aria-label="Pause">II</button>
    </div>
  </div>
  <script>
/* ===== util.js ===== */
/* Buddy Blade - small helpers + a pixel-grid sprite baker. */
var Util = (function () {
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function approach(v, target, step) {
    if (v < target) return Math.min(v + step, target);
    if (v > target) return Math.max(v - step, target);
    return v;
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  function canvas(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').imageSmoothingEnabled = false;
    return c;
  }

  /* rows: array of equal-length strings, pal: char -> css color ('.' = transparent) */
  function sprite(rows, pal) {
    var w = rows[0].length, h = rows.length;
    for (var i = 0; i < h; i++) {
      if (rows[i].length !== w) {
        throw new Error('sprite row ' + i + ' is ' + rows[i].length + ' wide, expected ' + w + ': "' + rows[i] + '"');
      }
    }
    var c = canvas(w, h), g = c.getContext('2d');
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var col = pal[rows[y][x]];
        if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
      }
    }
    return c;
  }

  function flip(src) {
    var c = canvas(src.width, src.height), g = c.getContext('2d');
    g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
    return c;
  }

  /* White silhouette of a sprite, used for hit flashes. */
  function silhouette(src, color) {
    var c = canvas(src.width, src.height), g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color || '#fff';
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }

  /* Deterministic value noise so generated tiles look the same every run. */
  function seeded(seed) {
    var s = seed >>> 0;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  return {
    clamp: clamp, lerp: lerp, approach: approach, rand: rand, randInt: randInt,
    pick: pick, aabb: aabb, dist: dist, canvas: canvas, sprite: sprite,
    flip: flip, silhouette: silhouette, seeded: seeded
  };
})();

/* ===== input.js ===== */
/* Keyboard, gamepad, and a floating analog touch stick.
   The touch layer stays invisible until the screen is actually touched,
   so keyboard and controller players never see it. */
var Input = (function () {
  var MAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyZ: 'jump', KeyK: 'jump',
    KeyX: 'attack', KeyJ: 'attack',
    Enter: 'confirm',
    Escape: 'pause', KeyP: 'pause',
    KeyM: 'mute', KeyR: 'restart'
  };
  var held = {}, fresh = {}, consumed = {};
  var stickX = 0;                 /* -1..1 from the touch stick or a pad */
  var host = null, stickEl = null, knobEl = null;
  var stickId = null, originX = 0, originY = 0;
  var RADIUS = 46, DEAD = 0.18;
  /* 'auto'  - the pad shows while you are touching and fades when you let go
     'always' - the pad stays put
     There is deliberately no "off": hiding the pad hid the pause button
     with it, which left no way back in. */
  var touchMode = 'auto';
  var sawTouch = false;
  var lastTouch = 0;
  var IDLE_MS = 1100;
  var mode = 'keyboard';          /* keyboard | touch | controller */

  function set(name, on) {
    if (!name) return;
    if (on) { if (!held[name]) fresh[name] = true; held[name] = true; }
    else held[name] = false;
  }

  /* ---------------- keyboard ---------------- */
  window.addEventListener('keydown', function (e) {
    var n = MAP[e.code];
    if (n) {
      e.preventDefault();
      if (!e.repeat) set(n, true);
      if (mode !== 'controller') mode = 'keyboard';
      hideTouch();
    }
  });
  window.addEventListener('keyup', function (e) {
    var n = MAP[e.code];
    if (n) { e.preventDefault(); set(n, false); }
  });
  window.addEventListener('blur', function () { held = {}; stickX = 0; releaseStick(); });

  /* Any keyboard or pad input puts the touch controls away again. */
  function hideTouch() {
    if (sawTouch) { sawTouch = false; apply(); }
  }
  function apply() {
    if (!host) return;
    if (!sawTouch || mode === 'controller') { host.classList.add('hidden'); return; }
    host.classList.remove('hidden');
    var idle = (touchMode === 'auto') && (Date.now() - lastTouch > IDLE_MS) && stickId === null;
    if (idle) host.classList.add('idle');
    else host.classList.remove('idle');
  }
  function touched() {
    lastTouch = Date.now();
    if (!sawTouch || mode !== 'touch') { sawTouch = true; mode = 'touch'; }
    apply();
  }

  /* ---------------- touch stick ---------------- */
  function moveKnob(dx, dy) {
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > RADIUS) { dx *= RADIUS / d; dy *= RADIUS / d; }
    if (knobEl) knobEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    var v = dx / RADIUS;
    stickX = Math.abs(v) < DEAD ? 0 : Math.max(-1, Math.min(1, (v - Math.sign(v) * DEAD) / (1 - DEAD)));
    /* a firm push downward still works as "down" for menus */
    set('down', dy > RADIUS * 0.55);
  }
  function releaseStick() {
    stickId = null; stickX = 0;
    set('down', false);
    if (stickEl) stickEl.classList.remove('live');
    if (knobEl) knobEl.style.transform = 'translate(0,0)';
  }

  function bindStick(zone) {
    zone.addEventListener('pointerdown', function (e) {
      if (stickId !== null) return;
      if (e.pointerType === 'touch') touched();
      stickId = e.pointerId;
      originX = e.clientX; originY = e.clientY;
      stickEl.style.left = originX + 'px';
      stickEl.style.top = originY + 'px';
      stickEl.classList.add('live');
      moveKnob(0, 0);
      /* capture keeps the drag alive if the thumb slides off the zone;
         it can throw if the pointer is already gone, which must not
         take the stick down with it */
      try { zone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    });
    zone.addEventListener('pointermove', function (e) {
      if (e.pointerId !== stickId) return;
      moveKnob(e.clientX - originX, e.clientY - originY);
      e.preventDefault();
    });
    function up(e) {
      if (e.pointerId !== stickId) return;
      releaseStick();
      e.preventDefault();
    }
    zone.addEventListener('pointerup', up);
    zone.addEventListener('pointercancel', up);
    zone.addEventListener('lostpointercapture', up);
  }

  function bindTouch() {
    host = document.getElementById('touch');
    if (!host) return;
    stickEl = document.getElementById('stick');
    knobEl = document.getElementById('knob');
    var zone = document.getElementById('stickzone');
    if (zone) bindStick(zone);

    var btns = host.querySelectorAll('.tbtn');
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        var key = b.getAttribute('data-key');
        var press = function (e) {
          e.preventDefault();
          set(key, true);
          if (key === 'jump') set('confirm', true);
        };
        var release = function (e) {
          e.preventDefault();
          set(key, false);
          if (key === 'jump') set('confirm', false);
        };
        b.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'touch') touched();
          press(e);
        });
        b.addEventListener('pointerup', release);
        b.addEventListener('pointercancel', release);
        b.addEventListener('pointerleave', release);
      })(btns[i]);
    }

    /* any touch reveals the pad; it fades again once you let go */
    window.addEventListener('touchstart', touched, { passive: true });
    window.addEventListener('touchmove', touched, { passive: true });
    window.addEventListener('touchend', function () { lastTouch = Date.now(); }, { passive: true });
    setInterval(apply, 200);
    apply();
  }

  /* ---------------- gamepad ---------------- */
  var padPrev = {};
  var padName = '';
  function pollPad() {
    if (!navigator.getGamepads) return;
    var pads = navigator.getGamepads();
    var gp = null;
    for (var i = 0; i < pads.length; i++) if (pads[i]) { gp = pads[i]; break; }
    if (!gp) { if (mode === 'controller') { mode = 'keyboard'; padName = ''; } return; }
    padName = gp.id || 'Controller';
    var active = false;
    var ax = gp.axes && gp.axes.length ? gp.axes[0] : 0;
    if (Math.abs(ax) > 0.25) { stickX = ax; active = true; }
    var B = gp.buttons || [];
    function btn(i) { return B[i] && B[i].pressed; }
    var map = { 14: 'left', 15: 'right', 12: 'up', 13: 'down',
                0: 'jump', 2: 'attack', 1: 'attack', 3: 'jump',
                9: 'pause', 8: 'restart' };
    for (var k in map) {
      var down = btn(Number(k));
      if (down !== !!padPrev[k]) {
        set(map[k], down);
        if (map[k] === 'jump' && down) set('confirm', true);
        if (map[k] === 'jump' && !down) set('confirm', false);
        padPrev[k] = down;
        if (down) active = true;
      }
    }
    if (active) {
      if (mode !== 'controller') { mode = 'controller'; }
      hideTouch();
    }
  }

  return {
    init: bindTouch,
    pollPad: pollPad,
    /* 'auto' or 'always'; never an off switch, so the pause button
       can never become unreachable */
    setTouchMode: function (m) { touchMode = m; lastTouch = Date.now(); apply(); },
    touchMode: function () { return touchMode; },
    mode: function () { return mode; },
    padName: function () { return padName; },
    /* a short, friendly label for whatever is driving the game */
    schemeLabel: function () {
      if (mode === 'controller') return 'CONTROLLER';
      if (mode === 'touch') return 'TOUCH';
      return 'KEYBOARD';
    },
    hasTouch: function () { return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; },
    down: function (n) { return !!held[n]; },
    pressed: function (n) {
      if (fresh[n] && !consumed[n]) { consumed[n] = true; return true; }
      return false;
    },
    endFrame: function () { fresh = {}; consumed = {}; },
    /* -1..1; analog from a stick, full tilt from keys */
    axis: function () {
      var k = (held.right ? 1 : 0) - (held.left ? 1 : 0);
      if (k !== 0) return k;
      return stickX;
    }
  };
})();

/* ===== audio.js ===== */
/* WebAudio: every sound is synthesised at runtime, no sample files. */
var Sfx = (function () {
  var ctx = null, master = null, musicGain = null;
  var enabled = true;
  var song = null, nextNoteTime = 0, step = 0;

  function ensure() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.16; musicGain.connect(master);
    return ctx;
  }
  function resume() { var c = ensure(); if (c && c.state === 'suspended') c.resume(); }

  function blip(opts) {
    if (!enabled) return;
    var c = ensure(); if (!c) return;
    var t = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(opts.freq, t);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t + opts.dur);
    var vol = opts.vol == null ? 0.22 : opts.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + opts.dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + opts.dur + 0.02);
  }

  function noise(dur, vol, filterFreq, sweepTo) {
    if (!enabled) return;
    var c = ensure(); if (!c) return;
    var t = c.currentTime;
    var len = Math.max(1, Math.floor(c.sampleRate * dur));
    var buf = c.createBuffer(1, len, c.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(filterFreq || 1800, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    var g = c.createGain(); g.gain.setValueAtTime(vol == null ? 0.18 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  /* ---- Music: tiny step sequencer driven from the game loop ---- */
  var SONGS = {
    meadow: {
      bpm: 132,
      lead: [64, 0, 67, 0, 71, 0, 67, 0, 64, 0, 62, 0, 64, 0, 0, 0,
             62, 0, 64, 0, 67, 0, 64, 0, 59, 0, 62, 0, 60, 0, 0, 0],
      bass: [40, 0, 40, 0, 47, 0, 47, 0, 45, 0, 45, 0, 43, 0, 43, 0,
             38, 0, 38, 0, 45, 0, 45, 0, 40, 0, 40, 0, 43, 0, 43, 0]
    },
    cavern: {
      bpm: 118,
      lead: [62, 0, 0, 65, 0, 69, 0, 0, 67, 0, 65, 0, 62, 0, 0, 0,
             60, 0, 0, 63, 0, 67, 0, 0, 65, 0, 63, 0, 60, 0, 0, 0],
      bass: [38, 0, 38, 0, 38, 0, 45, 0, 43, 0, 43, 0, 36, 0, 36, 0,
             36, 0, 36, 0, 41, 0, 41, 0, 38, 0, 38, 0, 33, 0, 33, 0]
    },
    keep: {
      bpm: 146,
      lead: [69, 0, 69, 71, 0, 72, 0, 71, 69, 0, 67, 0, 69, 0, 0, 0,
             64, 0, 67, 0, 69, 0, 72, 0, 71, 0, 69, 0, 67, 0, 64, 0],
      bass: [45, 45, 0, 45, 40, 0, 40, 0, 43, 43, 0, 43, 38, 0, 38, 0,
             45, 45, 0, 45, 41, 0, 41, 0, 40, 40, 0, 40, 35, 0, 35, 0]
    },
    boss: {
      bpm: 158,
      lead: [52, 52, 55, 52, 58, 0, 57, 0, 52, 52, 55, 52, 59, 0, 58, 0,
             52, 52, 55, 52, 60, 0, 59, 0, 58, 57, 56, 55, 54, 0, 0, 0],
      bass: [28, 28, 28, 28, 35, 35, 33, 33, 28, 28, 28, 28, 31, 31, 30, 30,
             28, 28, 28, 28, 35, 35, 33, 33, 31, 31, 30, 30, 29, 29, 28, 28]
    }
  };

  function hz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

  function voice(midi, when, dur, type, vol, dest) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(hz(midi), when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(dest);
    o.start(when); o.stop(when + dur + 0.02);
  }

  function playSong(name) {
    var s = SONGS[name];
    if (!s || song === s) return;
    song = s; step = 0; nextNoteTime = 0;
  }
  function stopSong() { song = null; }

  /* Call once per frame; schedules a little ahead of the audio clock. */
  function tick() {
    if (!enabled || !song || !ctx) return;
    var spb = 60 / song.bpm / 4; /* sixteenth notes */
    if (nextNoteTime === 0) nextNoteTime = ctx.currentTime + 0.06;
    while (nextNoteTime < ctx.currentTime + 0.25) {
      var i = step % song.lead.length;
      if (song.lead[i]) voice(song.lead[i], nextNoteTime, spb * 1.6, 'square', 0.18, musicGain);
      if (song.bass[i]) voice(song.bass[i], nextNoteTime, spb * 1.9, 'triangle', 0.3, musicGain);
      if (i % 4 === 0) {
        var g = ctx.createGain(), o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.setValueAtTime(110, nextNoteTime);
        o.frequency.exponentialRampToValueAtTime(45, nextNoteTime + 0.1);
        g.gain.setValueAtTime(0.22, nextNoteTime);
        g.gain.exponentialRampToValueAtTime(0.0001, nextNoteTime + 0.11);
        o.connect(g); g.connect(musicGain);
        o.start(nextNoteTime); o.stop(nextNoteTime + 0.13);
      }
      nextNoteTime += spb; step++;
    }
  }

  return {
    resume: resume,
    tick: tick,
    playSong: playSong,
    stopSong: stopSong,
    setEnabled: function (v) {
      enabled = v;
      if (!v && ctx) { stopSong(); master.gain.setValueAtTime(0, ctx.currentTime); }
      else if (ctx) master.gain.setValueAtTime(0.5, ctx.currentTime);
    },
    isEnabled: function () { return enabled; },
    jump:    function () { blip({ freq: 340, to: 720, dur: 0.14, type: 'square', vol: 0.16 }); },
    dbljump: function () { blip({ freq: 480, to: 900, dur: 0.13, type: 'triangle', vol: 0.18 }); },
    swing:   function () { noise(0.13, 0.13, 4200, 900); },
    hit:     function () { blip({ freq: 240, to: 90, dur: 0.12, type: 'square', vol: 0.2 }); noise(0.1, 0.12, 2600); },
    kill:    function () { blip({ freq: 180, to: 60, dur: 0.22, type: 'sawtooth', vol: 0.18 }); noise(0.18, 0.14, 1400); },
    coin:    function () { blip({ freq: 988, dur: 0.06, type: 'square', vol: 0.14 }); setTimeout(function () { blip({ freq: 1319, dur: 0.1, type: 'square', vol: 0.13 }); }, 55); },
    bone:    function () { [784, 988, 1175, 1568].forEach(function (f, i) { setTimeout(function () { blip({ freq: f, dur: 0.12, type: 'square', vol: 0.14 }); }, i * 80); }); },
    hurt:    function () { blip({ freq: 400, to: 120, dur: 0.3, type: 'sawtooth', vol: 0.2 }); },

    scale = scale || 1;

/* All artwork is generated at runtime: hand-written pixel grids run
   through an automatic shader, plus procedurally detailed tiles.
   No image files, no external assets. */
var Art = (function () {
  var S = Util.sprite, F = Util.flip;

  /* ---------------------------------------------------------------
     PIXEL SHADER
     Flat fill colours are the "clay"; these passes carve tone into
     them so sprites read as lit volumes instead of silhouettes.
  --------------------------------------------------------------- */
  function hex(c) {
    return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)];
  }
  function px(d, w, x, y) { return (y * w + x) * 4; }

  /* Replace `target` pixels with a 4-stop ramp keyed on how deep the
     pixel sits below the sprite's lit top edge, then darken underhangs. */
  function shade(cv, target, ramp) {
    var g = cv.getContext('2d'), w = cv.width, h = cv.height;
    var img = g.getImageData(0, 0, w, h), d = img.data;
    var t = hex(target);
    var R = ramp.map(hex);
    function isT(x, y) {
      if (x < 0 || y < 0 || x >= w || y >= h) return false;
      var i = px(d, w, x, y);
      return d[i + 3] > 0 && d[i] === t[0] && d[i + 1] === t[1] && d[i + 2] === t[2];
    }
    function solid(x, y) {
      if (x < 0 || y < 0 || x >= w || y >= h) return false;
      return d[px(d, w, x, y) + 3] > 0;
    }
    var out = new Uint8ClampedArray(d);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (!isT(x, y)) continue;
        /* how far below the top of this column of body we are */
        var depth = 0;
        while (depth < 5 && solid(x, y - depth - 1)) depth++;
        var tone;
        if (!solid(x, y - 1)) tone = R[0];            /* catching the light */
        else if (depth <= 1) tone = R[0];
        else if (depth === 2) tone = R[1];
        else if (depth === 3) tone = R[2];
        else tone = R[3];
        if (!solid(x, y + 1)) tone = R[3];            /* underside falls off */
        var i = px(d, w, x, y);
        out[i] = tone[0]; out[i + 1] = tone[1]; out[i + 2] = tone[2];
      }
    }
    img.data.set(out);
    g.putImageData(img, 0, 0);
    return cv;
  }

  /* A 1px light along upper-left facing edges. */
  function rim(cv, color, skip) {
    var g = cv.getContext('2d'), w = cv.width, h = cv.height;
    var img = g.getImageData(0, 0, w, h), d = img.data;
    var c = hex(color), sk = (skip || []).map(hex);

      return d[px(d, w, x, y) + 3] > 0;

    var out = new Uint8ClampedArray(d);
    for (var y = 0; y < h; y++) {

Art.tiles = function (themeName) {
  if (Art._tileCache[themeName]) return Art._tileCache[themeName];
  var T = Art.THEMES[themeName], N = 16;
  function nc() { return Util.canvas(N, N); }
  function tone(hexc, amt) {
    var r = Util.clamp(parseInt(hexc.substr(1, 2), 16) + amt, 0, 255);
    var g2 = Util.clamp(parseInt(hexc.substr(3, 2), 16) + amt, 0, 255);

      var y0 = course * 8;
      var shift = ((course + offset) % 2) ? 5 : 0;
      var x = -shift;
      while (x < N) {
        var bw = (x === -shift) ? 5 + shift : (rnd() > 0.5 ? 9 : 6);
        bw = Math.min(bw, N - x);
        if (bw > 1) {
          g.fillStyle = tone(C.base, Math.floor(rnd() * 5 - 2) * 5);
          g.fillRect(x, y0, bw - 1, 7);
          g.fillStyle = C.light; g.fillRect(x, y0, bw - 1, 1); g.fillRect(x, y0, 1, 6);
          g.fillStyle = C.dark;
          g.fillRect(x, y0 + 6, bw - 1, 1); g.fillRect(x + bw - 2, y0 + 1, 1, 6);

              g.fillStyle = rnd() > 0.5 ? C.dark : C.light;

                         y0 + 2 + Math.floor(rnd() * 3), 1, 1);
            }

      }
    }
    if (rnd() > 0.4) {
      g.fillStyle = C.deep;
      var cx = 2 + Math.floor(rnd() * 12), cy = 1 + Math.floor(rnd() * 10);
      for (var k = 0; k < 4 + Math.floor(rnd() * 4); k++) {

      for (var dy = -rad; dy <= rad; dy++) {

      g.fillStyle = C.light; g.fillRect(sx, sy, sw, 1);
      g.fillStyle = C.hi; g.fillRect(sx, sy, 1, 1);
      g.fillStyle = C.deep; g.fillRect(sx, sy + sh - 1, sw, 1);

  for (v = 0; v < 3; v++) {

      g2.fillStyle = T.capLight; g2.fillRect(0, 0, N, 2);

      g2.fillStyle = T.capDark;

      g2.fillStyle = T.dark; g2.fillRect(0, 6, N, 1);
      for (var x3 = 0; x3 < N; x3++) {      /* moss creeping over the lip */

      g.fillStyle = T.mortar; g.fillRect(0, N - 1, wd, 1);

      g.fillStyle = T.trimDark; g.fillRect(N - 1, 0, 1, N);
      g.fillStyle = T.light; g.fillRect(N - wd, 0, wd, 1);
      g.fillStyle = T.trimHi; g.fillRect(N - wd, 0, 1, N);
      g.fillStyle = T.mortar; g.fillRect(N - wd, N - 1, wd, 1);

  var trimB = overlay(function (g) {

  /* ---- one-way platform, with finished ends ---- */
  function platPiece(kind) {
    return overlay(function (g) {
      var woodA = themeName === 'meadow' ? '#7a5228' : '#544a68';
      var woodB = themeName === 'meadow' ? '#a2764a' : '#7a6f94';
      var woodC = themeName === 'meadow' ? '#c29a68' : '#a397bd';
      var iron = '#3f4854', ironHi = '#8b95a6';

      g.fillStyle = woodB; g.fillRect(0, 0, N, 4);
      g.fillStyle = woodC; g.fillRect(0, 0, N, 1);
      g.fillStyle = 'rgba(0,0,0,.30)';
      for (var pl = 2; pl < N; pl += 5) g.fillRect(pl, 1, 1, 6);

        g.fillStyle = ironHi; g.fillRect(ex, 0, 3, 1);

    g.fillStyle = '#4a4358'; g.fillRect(2, 12, N - 4, 3);

    platL: platL, platM: platM, platR: platR,
    spike: spike, hazard: haz, crate: crate, spring: spring, door: door

Art.drawCobweb = function (g, x, y, size, flip) {
  g.save();
  g.translate(x, y);
  if (flip) { g.scale(-1, 1); }
  g.strokeStyle = 'rgba(220,225,240,.30)';
  g.lineWidth = 1;
  for (var i = 1; i <= 3; i++) {
    g.beginPath();
    g.arc(0, 0, (size / 3) * i, 0, Math.PI / 2);
    g.stroke();
  }
  for (var a = 0; a <= 4; a++) {
    g.beginPath(); g.moveTo(0, 0);
    var ang = (Math.PI / 2) * (a / 4);
    g.lineTo(Math.cos(ang) * size, Math.sin(ang) * size);
    g.stroke();
  }
  g.restore();
};

Art.drawTorch = function (g, x, y, t, seed) {
  g.drawImage(Art.PROPS.BRACKET, x, y + 6);
  var fx = x + 2, fy = y + 4;
  var n = Math.sin(t * 0.31 + seed) * 0.5 + Math.sin(t * 0.17 + seed * 2.3) * 0.5;
  var hgt = 7 + Math.round(n * 1.8);
  for (var i = 0; i < hgt; i++) {
    var frac = i / hgt;
    var wdt = Math.max(1, Math.round((1 - frac) * 4 + Math.sin(t * 0.4 + i + seed) * 0.6));
    var sway = Math.round(Math.sin(t * 0.22 + i * 0.5 + seed) * frac * 1.8);
    g.fillStyle = frac < 0.25 ? '#fff3bc' : (frac < 0.55 ? '#ffb43c' : '#e0621e');
    g.fillRect(fx - Math.floor(wdt / 2) + sway, fy - i, wdt, 1);
  }
  if ((Math.floor(t * 0.5) + seed) % 7 === 0) {
    g.fillStyle = 'rgba(255,180,90,.7)';
    g.fillRect(fx + Math.round(Math.sin(t * 0.3 + seed) * 2), fy - hgt - 2 - (t % 6), 1, 1);
  }
};

Art.drawVine = function (g, x, y, len, t, seed) {
  for (var i = 0; i < len; i++) {
    var sway = Math.round(Math.sin(t * 0.03 + i * 0.35 + seed) * (i / len) * 1.8);
    g.fillStyle = i % 5 === 4 ? '#7ec94f' : '#3f7a2a';
    g.fillRect(x + sway, y + i, 1, 1);
    if (i % 4 === 2) { g.fillStyle = '#59a63f'; g.fillRect(x + sway + (i % 8 === 2 ? 1 : -1), y + i, 1, 1); }
  }
};

Art.drawChain = function (g, x, y, len) {
  for (var i = 0; i < len; i += 2) {
    g.fillStyle = '#6b7280'; g.fillRect(x, y + i, 2, 1);
    g.fillStyle = '#98a2b0'; g.fillRect(x, y + i, 1, 1);
    g.fillStyle = '#39414c'; g.fillRect(x, y + i + 1, 2, 1);
  }
};

/* ===================================================================
   LIGHTING
=================================================================== */
Art.light = function (g, x, y, radius, color) {
  var grad = g.createRadialGradient(x, y, 0, x, y, radius);
  grad.addColorStop(0, color);
  grad.addColorStop(0.45, color.replace(/[\d.]+\)$/, '0.20)'));
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(x - radius, y - radius, radius * 2, radius * 2);
};

Art.vignette = function (g, w, h, strength) {
  var grad = g.createRadialGradient(w / 2, h / 2, h * 0.38, w / 2, h / 2, h * 1.0);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(4,2,10,' + (strength || 0.5) + ')');
  g.fillStyle = grad;
  g.fillRect(0, 0, w, h);
};

/* ===================================================================
   FOREGROUND + ATMOSPHERE
   A near layer that passes in front of the action, and drifting motes,
   both parallaxed faster than the play field to give the scene depth.
=================================================================== */
Art.drawForeground = function (g, themeName, camX, camY, t, W, H) {
  if (themeName === 'meadow') return;       /* outdoors stays open */
  var T = Art.THEMES[themeName];
  var par = 1.30, spacing = 336, colW = 11;
  var first = Math.floor((camX * par - colW) / spacing);
  for (var i = first; i < first + Math.ceil(W / spacing) + 2; i++) {
    var x = Math.round(i * spacing - camX * par);
    if (x < -colW - 4 || x > W + colW) continue;
    g.save();
    g.globalAlpha = 0.80;
    /* shaft */
    g.fillStyle = '#100c18'; g.fillRect(x, 0, colW, H);
    g.fillStyle = '#1d1728'; g.fillRect(x + 1, 0, 2, H);
    g.fillStyle = '#080610'; g.fillRect(x + colW - 3, 0, 3, H);
    /* capital and base catch a little light */
    g.fillStyle = '#241c32';
    g.fillRect(x - 3, 14, colW + 6, 9);
    g.fillRect(x - 3, H - 30, colW + 6, 10);
    g.fillStyle = '#332942';
    g.fillRect(x - 3, 14, colW + 6, 2);
    g.fillRect(x - 3, H - 30, colW + 6, 2);
    g.restore();
  }
};

Art.drawMotes = function (g, themeName, camX, camY, t, W, H) {
  var n = themeName === 'meadow' ? 16 : 22;
  for (var i = 0; i < n; i++) {
    var seed = i * 71.3;
    var speed = 0.25 + (i % 5) * 0.08;
    var x = ((seed * 7.1 - camX * 0.9 + t * (themeName === 'meadow' ? 0.35 : 0.12)) % (W + 40) + W + 40) % (W + 40) - 20;
    var drift = Math.sin(t * 0.02 + seed) * 6;
    var y = ((seed * 3.7 + t * speed) % (H + 30)) - 15 + drift;
    var a = 0.16 + 0.24 * Math.abs(Math.sin(t * 0.03 + seed));
    if (themeName === 'meadow') {
      g.fillStyle = 'rgba(255,240,170,' + a + ')';
      g.fillRect(Math.round(x), Math.round(y), 2, 1);
    } else if (themeName === 'cavern') {
      g.fillStyle = 'rgba(170,225,255,' + a + ')';
      g.fillRect(Math.round(x), Math.round(y), 1, 1);
    } else {
      g.fillStyle = 'rgba(255,190,120,' + (a * 0.8) + ')';
      g.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
  }
};

/* ===================================================================
   BACKDROPS
   Interiors get real architecture: fluted columns with capitals and
   bases, arched niches between them, a belt course and hung banners.
=================================================================== */
Art.drawBackground = function (g, themeName, camX, camY, t, W, H) {
  var T = Art.THEMES[themeName];
  var grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, T.sky[0]);
  grad.addColorStop(0.55, T.sky[1]);
  grad.addColorStop(1, T.sky[2]);
  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  if (themeName === 'meadow') {
    g.fillStyle = 'rgba(255,246,200,.5)';
    g.beginPath(); g.arc(W - 70, 40, 18, 0, 7); g.fill();
    for (var c = 0; c < 6; c++) {
      var cx = ((c * 103 + t * 0.14 - camX * 0.07) % (W + 90)) - 45;
      var cy = 18 + (c % 3) * 17;
      g.fillStyle = 'rgba(255,255,255,.5)';
      g.fillRect(cx, cy, 26, 5); g.fillRect(cx + 6, cy - 4, 15, 5);
      g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(cx - 4, cy + 5, 32, 3);
    }
    /* far ridge */
    g.fillStyle = '#5d8a5f';
    for (var x = 0; x < W; x++) {
      var wx = x + camX * 0.15;
      var hh = Math.floor(30 + 12 * Math.sin(wx * 0.013) + 6 * Math.sin(wx * 0.041 + 1.1));
      g.fillRect(x, H - 60 - hh, 1, hh + 60);
    }
    /* treeline */
    g.fillStyle = '#3f7248';
    for (x = 0; x < W; x++) {
      var wx2 = x + camX * 0.3;
      var h2 = Math.floor(18 + 9 * Math.sin(wx2 * 0.026) + 5 * Math.sin(wx2 * 0.07 + 2.2));
      g.fillRect(x, H - 40 - h2, 1, h2 + 40);
    }
    g.fillStyle = '#2f5738';
    for (x = 0; x < W; x++) {
      var wx3 = x + camX * 0.5;
      var h3 = Math.floor(11 + 6 * Math.sin(wx3 * 0.035 + 2) + 3 * Math.sin(wx3 * 0.09));
      g.fillRect(x, H - 22 - h3, 1, h3 + 22);
    }
  } else {
    var px = camX * 0.4, py = camY * 0.4;
    var ts = Art.tiles(themeName), Cw = T.wall;

    /* masonry panelling */
    var ox = Math.floor(px) % 16, oy = Math.floor(py) % 16;
    for (var ty = -1; ty <= Math.ceil(H / 16); ty++) {
      for (var tx = -1; tx <= Math.ceil(W / 16); tx++) {
        var wx4 = tx + Math.floor(px / 16), wy4 = ty + Math.floor(py / 16);
        var shade2 = ((wx4 * 7 + wy4 * 13) >>> 0) % 3;
        g.fillStyle = shade2 === 0 ? Cw.base : (shade2 === 1 ? Cw.light : Cw.dark);
        g.fillRect(tx * 16 - ox, ty * 16 - oy, 16, 16);
        g.fillStyle = Cw.mortar;
        g.fillRect(tx * 16 - ox, ty * 16 - oy, 16, 1);
        g.fillRect(tx * 16 - ox + ((wy4 % 2) ? 8 : 0), ty * 16 - oy, 1, 16);
        g.fillStyle = 'rgba(255,255,255,.04)';
        g.fillRect(tx * 16 - ox, ty * 16 - oy + 1, 16, 1);
      }
    }

    /* belt course */
    var beltY = Math.round(58 - py);
    g.fillStyle = Cw.light; g.fillRect(0, beltY, W, 5);
    g.fillStyle = T.trimHi; g.fillRect(0, beltY, W, 1);
    g.fillStyle = Cw.dark; g.fillRect(0, beltY + 4, W, 2);

    /* bays: a column, then a niche, repeating */
    var bay = 96, colW = 20;
    var first = Math.floor((px - bay) / bay);
    for (var bI = first; bI < first + Math.ceil(W / bay) + 2; bI++) {
      var bx = Math.round(bI * bay - px);

      /* arched niche between the columns */
      var nx = bx + colW + 14, nw = bay - colW - 30;
      if (nw > 16) {
        var ny = Math.round(64 - py), nh = 62;
        g.fillStyle = 'rgba(0,0,0,.50)';
        g.fillRect(nx, ny, nw, nh);
        g.beginPath(); g.arc(nx + nw / 2, ny, nw / 2, Math.PI, 0); g.fill();
        g.fillStyle = Cw.light;
        g.fillRect(nx - 2, ny - 1, 2, nh + 1); g.fillRect(nx + nw, ny - 1, 2, nh + 1);
        g.strokeStyle = Cw.light; g.lineWidth = 2;
        g.beginPath(); g.arc(nx + nw / 2, ny, nw / 2 + 1, Math.PI, 0); g.stroke();
        g.fillStyle = themeName === 'keep' ? 'rgba(120,70,150,.18)' : 'rgba(80,150,200,.14)';
        g.fillRect(nx + 3, ny - 6, nw - 6, nh - 8);
        /* an urn standing in the recess */
        if ((bI % 2) === 0) {
          g.drawImage(themeName === 'keep' ? Art.PROPS.VASE : Art.PROPS.CRYSTAL,
                      Math.round(nx + nw / 2 - 4), ny + nh - 12);
        }
      }

      /* fluted column */
      g.fillStyle = Cw.base; g.fillRect(bx, 0, colW, H);
      g.fillStyle = Cw.light; g.fillRect(bx, 0, 2, H);
      g.fillStyle = Cw.dark; g.fillRect(bx + colW - 3, 0, 3, H);
      for (var fl = 4; fl < colW - 4; fl += 5) {
        g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(bx + fl, 0, 2, H);
        g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(bx + fl + 2, 0, 1, H);
      }
      /* capital + base */
      var capY = Math.round(40 - py);
      g.fillStyle = T.trim; g.fillRect(bx - 3, capY, colW + 6, 8);
      g.fillStyle = T.trimHi; g.fillRect(bx - 3, capY, colW + 6, 2);
      g.fillStyle = T.trimDark; g.fillRect(bx - 3, capY + 7, colW + 6, 1);
      var baseY = Math.round(150 - py);
      g.fillStyle = T.trim; g.fillRect(bx - 3, baseY, colW + 6, 9);
      g.fillStyle = T.trimHi; g.fillRect(bx - 3, baseY, colW + 6, 2);
      /* hung banner on every third bay */
      if (themeName === 'keep' && (((bI % 3) + 3) % 3) === 1) {
        Art.drawChain(g, bx + colW / 2 - 1, capY + 8, 10);
        g.drawImage(Art.PROPS.BANNER, Math.round(bx + colW / 2 - 4), capY + 18);
      }
      if (themeName === 'cavern' && (((bI % 2) + 2) % 2) === 1) {
        g.drawImage(Art.PROPS.CRYSTAL, bx + 6, Math.round(96 - py));
      }
      /* cobwebs where the column meets the ceiling */
      Art.drawCobweb(g, bx + colW + 1, Math.round(2 - py), 13, false);
      Art.drawCobweb(g, bx - 1, Math.round(2 - py), 13, true);
    }

    if (themeName === 'cavern') {
      for (var m = 0; m < 24; m++) {
        var mx = ((m * 53 - camX * 0.45) % (W + 20) + W + 20) % (W + 20) - 10;
        var my = (H - 20 - ((t * 0.28 + m * 29) % (H + 20)));
        g.fillStyle = 'rgba(160,220,255,' + (0.12 + 0.2 * Math.abs(Math.sin(t * 0.04 + m))) + ')';
        g.fillRect(mx, my, 1, 1);
      }
    }
  }
  g.fillStyle = T.ambient; g.fillRect(0, 0, W, H);
};

/* ===================================================================
   BOSSES - built from shaded rectangles so limbs can animate.
=================================================================== */
Art.drawBoss = function (g, e, t) {
  var x = Math.round(e.x), y = Math.round(e.y), fc = e.facing;
  g.save();
  g.translate(x + e.w / 2, y + e.h);
  g.scale(fc, 1);
  g.translate(-e.w / 2, -e.h);
  if (e.kind === 'boar') Art._boar(g, e, t);
  else if (e.kind === 'gloomwing') Art._wing(g, e, t);
  else Art._king(g, e, t);
  g.restore();
  if (e.flash > 0) {
    g.save();
    g.globalAlpha = 0.6; g.globalCompositeOperation = 'lighter';
    g.fillStyle = '#ffffff';
    g.fillRect(x, y, e.w, e.h);
    g.restore();
  }
};

/* helper: a rectangle with a lit top and a shaded underside */
function plate(g, x, y, w, h, base, light, dark) {
  g.fillStyle = base; g.fillRect(x, y, w, h);
  g.fillStyle = light; g.fillRect(x, y, w, 1);
  if (h > 2) { g.fillStyle = dark; g.fillRect(x, y + h - 1, w, 1); }
}

Art._boar = function (g, e, t) {
  var W = e.w, H = e.h;
  var bob = e.state === 'charge' ? Math.sin(t * 0.7) : Math.sin(t * 0.12);
  var swing = e.state === 'charge' ? Math.sin(t * 0.9) * 4 : 0;
  /* legs */
  plate(g, 8, H - 10, 7, 10, '#33241b', '#4a3527', '#1f1610');
  plate(g, W - 17 + swing, H - 10, 7, 10, '#33241b', '#4a3527', '#1f1610');
  plate(g, 17 - swing, H - 9, 6, 9, '#2b1e16', '#3b2a20', '#171009');
  plate(g, W - 25, H - 9, 6, 9, '#2b1e16', '#3b2a20', '#171009');
  /* hooves */
  g.fillStyle = '#16100c';
  g.fillRect(8, H - 2, 7, 2); g.fillRect(W - 17 + swing, H - 2, 7, 2);
  /* barrel body */
  plate(g, 5, 10 + bob, W - 10, H - 18, '#5c4230', '#7a5a41', '#2f2118');
  g.fillStyle = '#6e5039'; g.fillRect(8, 13 + bob, W - 20, 7);
  g.fillStyle = '#3f2d20'; g.fillRect(5, H - 11 + bob, W - 10, 3);
  /* bristled spine */
  for (var i = 8; i < W - 14; i += 4) {
    g.fillStyle = '#231913';
    var sp = 5 + Math.round(Math.sin(t * 0.3 + i) * 0.6);
    g.fillRect(i, sp + bob, 2, 6);
    g.fillStyle = '#3f2d20'; g.fillRect(i, sp + bob, 1, 3);
  }
  /* head */
  plate(g, W - 21, 13 + bob, 19, H - 22, '#6e5039', '#8a6647', '#3f2d20');
  g.fillStyle = '#4a3527'; g.fillRect(W - 9, 19 + bob, 9, 11);
  /* snout */
  plate(g, W - 7, 23 + bob, 7, 8, '#8a6647', '#a37f5c', '#4a3527');
  g.fillStyle = '#2b1e16';
  g.fillRect(W - 4, 25 + bob, 2, 2); g.fillRect(W - 4, 28 + bob, 2, 2);
  /* tusks */
  g.fillStyle = '#efe6cd';
  g.fillRect(W - 8, 21 + bob, 4, 2);
  g.fillRect(W - 10, 18 + bob, 2, 4);
  g.fillStyle = '#fffaf0';
  g.fillRect(W - 8, 21 + bob, 4, 1);
  /* eye */
  g.fillStyle = '#1a1210'; g.fillRect(W - 14, 18 + bob, 5, 4);
  g.fillStyle = e.state === 'stun' ? '#8c8c8c' : '#ff4b3a';
  g.fillRect(W - 13, 19 + bob, 3, 2);
  if (e.state !== 'stun') { g.fillStyle = '#ffd0a0'; g.fillRect(W - 13, 19 + bob, 1, 1); }
  /* ear */
  plate(g, W - 24, 9 + bob, 7, 8, '#4a3527', '#634833', '#2b1e16');
  /* stun stars */
  if (e.state === 'stun') {
    for (var s = 0; s < 3; s++) {
      var a = t * 0.12 + s * 2.1;
      g.fillStyle = '#ffe27a';
      g.fillRect(W - 14 + Math.round(Math.cos(a) * 9), 4 + Math.round(Math.sin(a) * 3) + bob, 2, 2);
    }
  }
};

Art._wing = function (g, e, t) {
  var W = e.w, H = e.h;
  var flap = Math.sin(t * (e.state === 'dive' ? 0.5 : 0.18));
  var wy = Math.round(flap * 7);
  /* membranes */
  function wing(dir) {
    var sx = W / 2 + dir * 6;
    g.fillStyle = '#42295e';
    g.beginPath();
    g.moveTo(sx, 12);
    g.lineTo(W / 2 + dir * (W / 2 - 2), 8 + wy);
    g.lineTo(W / 2 + dir * (W / 2 - 6), 21 + wy);
    g.lineTo(sx, 23);
    g.closePath(); g.fill();
    g.fillStyle = '#5e3d82';
    g.beginPath();
    g.moveTo(sx, 12);
    g.lineTo(W / 2 + dir * (W / 2 - 4), 10 + wy);
    g.lineTo(sx + dir * 5, 17);
    g.closePath(); g.fill();
    /* finger bones */
    g.fillStyle = '#7d55a8';
    g.fillRect(W / 2 + dir * 8, 11 + Math.round(wy * 0.4), dir > 0 ? W / 2 - 10 : -(W / 2 - 10), 1);
  }
  wing(-1); wing(1);
  /* body */
  plate(g, W / 2 - 8, 7, 16, H - 13, '#7d55a8', '#a077cc', '#4a2f6b');
  g.fillStyle = '#5e3d82'; g.fillRect(W / 2 - 8, H - 11, 16, 4);
  /* ruff */
  g.fillStyle = '#c9a8e8';
  for (var r = -6; r < 7; r += 3) g.fillRect(W / 2 + r, 18, 2, 3);
  /* ears */
  g.fillStyle = '#42295e';
  g.fillRect(W / 2 - 8, 0, 3, 8); g.fillRect(W / 2 + 5, 0, 3, 8);
  g.fillStyle = '#7d55a8';
  g.fillRect(W / 2 - 7, 2, 1, 5); g.fillRect(W / 2 + 6, 2, 1, 5);
  /* face */
  plate(g, W / 2 - 7, 10, 14, 9, '#9d74c9', '#bb98e0', '#6b4594');
  g.fillStyle = '#2a1636';
  g.fillRect(W / 2 - 5, 12, 4, 4); g.fillRect(W / 2 + 1, 12, 4, 4);
  g.fillStyle = e.state === 'stun' ? '#6b6b6b' : '#ffe27a';
  g.fillRect(W / 2 - 4, 13, 2, 2); g.fillRect(W / 2 + 2, 13, 2, 2);
  g.fillStyle = '#fffaf0';
  g.fillRect(W / 2 - 3, 18, 2, 4); g.fillRect(W / 2 + 1, 18, 2, 4);
  /* claws */
  g.fillStyle = '#42295e';
  g.fillRect(W / 2 - 7, H - 7, 5, 6); g.fillRect(W / 2 + 2, H - 7, 5, 6);
  g.fillStyle = '#d9d1b8';

};

Art._king = function (g, e, t) {
  var W = e.w, H = e.h;
  var bob = Math.round(Math.sin(t * 0.09));
  var raise = e.state === 'slam' ? -8 : 0;
  /* legs + sabatons */
  plate(g, 9, H - 12, 9, 12, '#3a3448', '#544c68', '#231f30');
  plate(g, W - 19, H - 12, 9, 12, '#3a3448', '#544c68', '#231f30');
  g.fillStyle = '#1b1826';
  g.fillRect(7, H - 3, 12, 3); g.fillRect(W - 21, H - 3, 12, 3);
  /* cloak */
  g.fillStyle = '#5e1730';
  g.fillRect(3, 15 + bob, W - 12, H - 24);
  g.fillStyle = '#8e2438';
  g.fillRect(3, 15 + bob, W - 12, 4);
  g.fillStyle = '#3d0e20';
  for (var f = 6; f < W - 12; f += 7) g.fillRect(f, 19 + bob, 1, H - 28);
  /* cuirass */
  plate(g, 8, 14 + bob, W - 18, 17, '#8b8299', '#bdb4cc', '#4a4358');
  g.fillStyle = '#a79eb8'; g.fillRect(10, 17 + bob, W - 24, 4);
  g.fillStyle = '#e8c45c';
  g.fillRect(9, 23 + bob, W - 20, 1);
  g.fillRect(W / 2 - 3, 18 + bob, 5, 8);
  g.fillStyle = '#fff3bc'; g.fillRect(W / 2 - 3, 18 + bob, 5, 1);
  /* pauldron */
  plate(g, 6, 12 + bob, 11, 8, '#9d94ab', '#cfc6dd', '#544c68');
  /* hound helm */
  plate(g, W - 25, 1 + bob, 21, 16, '#4a4358', '#6b6284', '#2a2536');
  g.fillStyle = '#3b352f'; g.fillRect(W - 13, 8 + bob, 12, 8);
  g.fillStyle = '#231f18'; g.fillRect(W - 13, 12 + bob, 12, 2);
  g.fillStyle = '#efe6cd';
  g.fillRect(W - 6, 14 + bob, 5, 2);
  g.fillStyle = '#1a1220'; g.fillRect(W - 17, 5 + bob, 7, 5);
  g.fillStyle = '#ff5a3a'; g.fillRect(W - 16, 6 + bob, 5, 3);
  g.fillStyle = '#ffd0a0'; g.fillRect(W - 16, 6 + bob, 2, 1);
  /* plume */
  for (var p = 0; p < 7; p++) {
    g.fillStyle = p % 2 ? '#c9a24a' : '#e8c45c';
    g.fillRect(W - 24 + Math.round(Math.sin(t * 0.08 + p * 0.5) * 1.2), -5 + p + bob, 3, 1);
  }
  /* greatsword */
  g.save();
  g.translate(W - 8, 22 + bob + raise);
  g.rotate(e.state === 'slam' ? -0.9 : (e.state === 'sweep' ? 0.5 : -0.25));
  g.fillStyle = '#2a2536'; g.fillRect(-5, -2, 7, 5);
  g.fillStyle = '#e8c45c'; g.fillRect(1, -4, 2, 9);
  g.fillStyle = '#8b8299'; g.fillRect(3, -3, 27, 5);
  g.fillStyle = '#dfe6f0'; g.fillRect(3, -3, 27, 1);
  g.fillStyle = '#ffffff'; g.fillRect(3, -3, 27, 1);
  g.fillStyle = '#5a5468'; g.fillRect(3, 1, 27, 1);
  g.restore();
};

/* ===== save.js ===== */
/* Persistence + the shop catalogue. */
var Save = (function () {
  /* Storage key kept from the old title on purpose - renaming it would
     wipe every existing save. */
  var KEY = 'blacklabblade.save.v2';
  var data = null;

  function fresh() {
    return {
      coins: 0,
      unlocked: 1,        /* how many stages are playable */
      cleared: {},        /* stage id -> true          */
      gems: {},           /* stage id -> gems found 0-3 */
      chests: {},         /* stage id -> chests found   */
      sword: 0,           /* index into Art.BLADES */
      collar: 0,          /* extra hearts */
      relics: {},         /* relic id -> true */
      sound: true,
      touchMode: 'auto',  /* 'auto' fades when idle, 'always' stays put */
      seenIntro: false
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      data = raw ? JSON.parse(raw) : fresh();
    } catch (e) { data = fresh(); }
    var f = fresh();
    for (var k in f) if (!(k in data)) data[k] = f[k];
    return data;
  }
  function flush() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode */ }
  }
  function get() { return data || load(); }
  function wipe() { data = fresh(); flush(); return data; }

  var SHOP = [
    { id: 'sword1', kind: 'sword', tier: 1, name: 'Iron Fang', cost: 60,
      desc: '2 damage. A real blade.' },
    { id: 'collar1', kind: 'collar', tier: 1, name: 'Studded Collar', cost: 80,
      desc: '+1 heart.' },
    { id: 'spring', kind: 'relic', name: 'Gale Collar', cost: 130,
      desc: 'A third jump in mid-air.' },
    { id: 'swift', kind: 'relic', name: 'Swift Paws', cost: 90,
      desc: 'Run noticeably faster.' },
    { id: 'sword2', kind: 'sword', tier: 2, name: 'Emberblade', cost: 180,
      desc: '3 damage, longer reach.' },
    { id: 'magnet', kind: 'relic', name: 'Wet Nose', cost: 120,
      desc: 'Coins drift toward you.' },
    { id: 'collar2', kind: 'collar', tier: 2, name: 'Iron Collar', cost: 200,
      desc: '+2 hearts total.' },
    { id: 'lucky', kind: 'relic', name: 'Lucky Tag', cost: 150,
      desc: 'Coins are worth double.' },
    { id: 'sword3', kind: 'sword', tier: 3, name: 'Stormfang', cost: 320,
      desc: '4 damage, longest reach.' },
    { id: 'guard', kind: 'relic', name: 'Thick Coat', cost: 260,
      desc: 'Longer mercy time after a hit.' }
  ];

  function owned(item) {
    var d = get();
    if (item.kind === 'sword') return d.sword >= item.tier;
    if (item.kind === 'collar') return d.collar >= item.tier;
    return !!d.relics[item.id];
  }
  /* Tiered gear must be bought in order. */
  function available(item) {
    var d = get();
    if (owned(item)) return false;
    if (item.kind === 'sword') return d.sword === item.tier - 1;
    if (item.kind === 'collar') return d.collar === item.tier - 1;
    return true;
  }
  function buy(item) {
    var d = get();
    if (owned(item) || !available(item) || d.coins < item.cost) return false;
    d.coins -= item.cost;
    if (item.kind === 'sword') d.sword = item.tier;
    else if (item.kind === 'collar') d.collar = item.tier;
    else d.relics[item.id] = true;
    flush();
    return true;
  }

  function has(relicId) { return !!get().relics[relicId]; }
  function addCoins(n) { get().coins += n; }
  function clearStage(index, gems, chests) {
    var d = get(), L = LEVELS[index];
    d.cleared[L.id] = true;
    /* keep the best haul across attempts */
    d.gems[L.id] = Math.max(d.gems[L.id] || 0, gems || 0);
    d.chests[L.id] = Math.max(d.chests[L.id] || 0, chests || 0);
    if (d.unlocked < index + 2) d.unlocked = Math.min(index + 2, LEVELS.length);
    flush();
  }
  function gemsFound() {
    var d = get(), n = 0;
    for (var k in d.gems) n += d.gems[k] || 0;
    return n;
  }
  function chestsFound() {
    var d = get(), n = 0;
    for (var k in d.chests) n += d.chests[k] || 0;
    return n;
  }
  function gemsTotal() {
    var n = 0;
    for (var i = 0; i < LEVELS.length; i++) if (!LEVELS[i].boss) n += 3;
    return n;
  }
  function allCleared() {
    for (var i = 0; i < LEVELS.length; i++) if (!get().cleared[LEVELS[i].id]) return false;
    return true;
  }

  return {
    load: load, get: get, flush: flush, wipe: wipe,
    SHOP: SHOP, owned: owned, available: available, buy: buy,
    has: has, addCoins: addCoins, clearStage: clearStage,
    gemsFound: gemsFound, chestsFound: chestsFound, gemsTotal: gemsTotal,
    allCleared: allCleared
  };
})();

/* ===== entities.js ===== */
/* Actors: the hero, the beasts, the bosses and everything they throw. */
var TILE = 16;
var GRAV = 0.62;
var MAXFALL = 8.0;

/* Jump feel. A tap gives a real jump that clears a two-tile ledge on its
   own; holding adds lift for a few frames for roughly half again the
   height. Tuned by simulation - see tools/reach.js, which reads these. */
var RUN_SPEED = 1.75;
var RUN_SPEED_SWIFT = 2.2;
var JUMP_IMPULSE = 6.8;      /* tap  -> 34px, about 2.4x the hero */
var JUMP_LIFT = 0.16;        /* added per frame while held */
var JUMP_LIFT_FRAMES = 10;   /* hold -> 46px (2.8 tiles), 26f airtime */
var DBL_JUMP_IMPULSE = 6.2;
var DBL_LIFT_FRAMES = 6;     /* shorter hold on the air jump, so it snaps */
var BASE_JUMPS = 2;          /* ground jump + one in mid-air, always */
var ATTACK_FRAMES = 17;

/* ------------------------------------------------------------------ */
function Particle(x, y, vx, vy, life, color, size) {
  this.x = x; this.y = y; this.vx = vx; this.vy = vy;
  this.life = life; this.max = life; this.color = color; this.size = size || 1;
  this.grav = 0.12;
}
Particle.prototype.update = function () {
  this.x += this.vx; this.y += this.vy;
  this.vy += this.grav; this.vx *= 0.96;
  this.life--;
};
Particle.prototype.draw = function (g, cam) {
  g.globalAlpha = Math.max(0, this.life / this.max);
  g.fillStyle = this.color;
  g.fillRect(Math.round(this.x - cam.x), Math.round(this.y - cam.y), this.size, this.size);
  g.globalAlpha = 1;
};

function FloatText(x, y, text, color) {
  this.x = x; this.y = y; this.text = text; this.color = color || '#ffe27a';
  this.life = 46;
}
FloatText.prototype.update = function () { this.y -= 0.35; this.life--; };
FloatText.prototype.draw = function (g, cam) {
  g.globalAlpha = Math.min(1, this.life / 20);
  Text.draw(g, this.text, Math.round(this.x - cam.x), Math.round(this.y - cam.y), this.color);
  g.globalAlpha = 1;
};

/* ------------------------------------------------------------------ */
function Pickup(x, y, kind) {
  this.x = x; this.y = y; this.kind = kind;
  this.w = kind === 'bone' ? 10 : 7;
  this.h = kind === 'bone' ? 6 : 7;
  this.vx = 0; this.vy = 0;
  this.t = Math.random() * 6.28;
  this.dead = false;
  this.loose = false;   /* dropped from a crate: obeys gravity */
  this.magnetized = false;
}
Pickup.prototype.update = function (w) {
  this.t += 0.12;
  if (this.loose) {
    this.vy = Math.min(this.vy + GRAV * 0.6, 4);
    w.moveActor(this, true);
    if (this.grounded) { this.vx *= 0.82; this.vy = 0; }
  }
  if (this.kind === 'coin' && Save.has('magnet')) {
    var p = w.player;
    var d = Util.dist(this.x, this.y, p.x, p.y);
    if (d < 62) {
      this.magnetized = true;
      var a = Math.atan2(p.y + p.h / 2 - this.y, p.x + p.w / 2 - this.x);
      this.x += Math.cos(a) * 1.9;
      this.y += Math.sin(a) * 1.9;
    }
  }
};
Pickup.prototype.draw = function (g, cam) {
  var bob = this.loose && !this.grounded ? 0 : Math.round(Math.sin(this.t) * 1.4);
  var sx = Math.round(this.x - cam.x), sy = Math.round(this.y - cam.y + bob);
  if (this.kind === 'coin') g.drawImage(Art.COIN, sx, sy);
  else if (this.kind === 'gem') {
    g.save();
    g.globalAlpha = 0.20 + 0.14 * Math.sin(this.t * 1.1);
    g.fillStyle = '#ffffff';
    g.fillRect(sx - 2, sy - 2, this.w + 4, this.h + 4);
    g.restore();
    g.drawImage(Art.GEMS[this.theme] || Art.GEMS.meadow, sx, sy);
  } else g.drawImage(Art.MEAT, sx, sy);
};

/* ------------------------------------------------------------------
   A strongbox walled up in a secret chamber. Break it open with the
   blade, or just bump into it.
------------------------------------------------------------------ */
function Chest(x, y) {
  this.x = x; this.y = y;
  this.w = 14; this.h = 13;
  this.open = false;
  this.t = 0;
  this.dead = false;
}
Chest.prototype.pop = function (w) {
  if (this.open) return;
  this.open = true;
  Sfx.bone();
  w.shake(4);
  w.chestsGot++;
  var cx = this.x + this.w / 2, cy = this.y + 2;
  for (var i = 0; i < 16; i++) w.dropCoin(cx, cy);
  for (var j = 0; j < 14; j++) {
    w.parts.push(new Particle(cx, cy, Util.rand(-2, 2), Util.rand(-3.2, -0.6),
      Util.randInt(20, 40), Util.pick(['#e8c45c', '#fff3bc', '#c08a42']), 2));
  }
  w.texts.push(new FloatText(this.x - 6, this.y - 8, 'TREASURE!', '#e8c45c'));
};
Chest.prototype.update = function (w) {
  this.t++;
  if (!this.open && Util.aabb(this, w.player)) this.pop(w);
};
Chest.prototype.draw = function (g, cam) {
  var img = this.open ? Art.CHEST_OPEN : Art.CHEST;
  var bob = this.open ? 0 : Math.round(Math.sin(this.t * 0.06) * 0.5);
  g.drawImage(img, Math.round(this.x - cam.x), Math.round(this.y - cam.y + bob));
  if (!this.open) {
    g.save();
    g.globalAlpha = 0.18 + 0.12 * Math.sin(this.t * 0.08);
    g.fillStyle = '#e8c45c';
    g.fillRect(Math.round(this.x - cam.x) + 5, Math.round(this.y - cam.y) + 6, 4, 3);
    g.restore();
  }
};

/* ------------------------------------------------------------------ */
function Shot(x, y, vx, vy, kind) {
  this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.kind = kind;
  this.w = kind === 'shock' ? 10 : 4;
  this.h = kind === 'shock' ? 10 : 4;
  this.life = kind === 'shock' ? 150 : 260;
  this.dead = false;
  this.t = 0;
}
Shot.prototype.update = function (w) {
  this.t++;
  this.x += this.vx; this.y += this.vy;
  if (this.kind === 'sonic') this.vy += 0.02;
  if (--this.life <= 0) this.dead = true;
  if (this.kind === 'shock') {
    /* hugs the floor; dies at a wall */
    if (w.solidAt(this.x + (this.vx > 0 ? this.w + 1 : -1), this.y + this.h - 2)) this.dead = true;
    while (!w.solidAt(this.x + this.w / 2, this.y + this.h + 1) && this.life > 0) {
      this.y += 1;
      if (this.y > w.pixelH) { this.dead = true; break; }
    }
  } else if (w.solidAt(this.x + this.w / 2, this.y + this.h / 2)) {
    this.dead = true;
    w.puff(this.x, this.y, '#c9a2d8', 4);
  }
};
Shot.prototype.draw = function (g, cam) {
  var sx = Math.round(this.x - cam.x), sy = Math.round(this.y - cam.y);
  if (this.kind === 'thorn') {
    g.save(); g.translate(sx + 2, sy + 2); g.rotate(this.t * 0.3);
    g.drawImage(Art.THORNBALL, -2, -2); g.restore();
  } else if (this.kind === 'sonic') {
    g.fillStyle = '#c9a2f0';
    g.fillRect(sx, sy + 1, 4, 2); g.fillRect(sx + 1, sy, 2, 4);
  } else {
    var h = 6 + Math.round(Math.sin(this.t * 0.4) * 2);
    g.fillStyle = 'rgba(255,190,120,.85)';
    g.fillRect(sx, sy + this.h - h, this.w, h);
    g.fillStyle = '#fff0c0';
    g.fillRect(sx, sy + this.h - h, this.w, 1);
  }
};

/* ------------------------------------------------------------------ */
function Enemy(x, y, type, world) {
  this.x = x; this.y = y; this.type = type;
  this.vx = 0; this.vy = 0;
  this.facing = -1;
  this.dead = false;
  this.flash = 0;
  this.t = Math.random() * 100;
  this.grounded = false;
  this.hitWall = false;
  this.state = 'walk';
  this.timer = 0;
  var bonus = Math.max(0, (world || 1) - 1);
  if (type === 'grub') {
    this.w = 12; this.h = 10; this.hp = 2 + bonus; this.speed = 0.32;
    this.ox = -1; this.oy = -2;
  } else if (type === 'bat') {
    this.w = 12; this.h = 8; this.hp = 2 + bonus; this.speed = 1.15;
    this.ox = -2; this.oy = -2; this.homeY = y;
  } else if (type === 'hound') {
    this.w = 14; this.h = 13; this.hp = 3 + bonus; this.speed = 0.5;
    this.ox = -2; this.oy = -1;
  } else { /* thorn turret */
    this.w = 12; this.h = 14; this.hp = 3 + bonus; this.speed = 0;
    this.ox = -2; this.oy = -2; this.timer = 40 + Math.floor(Math.random() * 60);
  }
  this.maxHp = this.hp;
}
Enemy.prototype.hurt = function (dmg, dir, w) {
  this.hp -= dmg;
  this.flash = 8;
  if (this.type !== 'thorn') { this.vx = dir * 1.4; this.vy = -1.2; }
  if (this.hp <= 0) {
    this.dead = true;
    Sfx.kill();
    w.puff(this.x + this.w / 2, this.y + this.h / 2, '#ffd75e', 10);
    w.shake(3);
    var n = this.type === 'hound' ? 3 : (this.type === 'thorn' ? 3 : 2);
    for (var i = 0; i < n; i++) w.dropCoin(this.x + this.w / 2, this.y + this.h / 2);
  } else {
    Sfx.hit();
    w.puff(this.x + this.w / 2, this.y + this.h / 2, '#ffffff', 4);
  }
};
Enemy.prototype.update = function (w) {
  this.t++;
  if (this.flash > 0) this.flash--;
  var p = w.player;

  if (this.type === 'grub') {
    this.vx = Util.approach(this.vx, this.facing * this.speed, 0.08);
    this.vy = Math.min(this.vy + GRAV, MAXFALL);
    w.moveActor(this);
    if (this.hitWall) this.facing *= -1;
    /* turn at a ledge */
    if (this.grounded) {
      var ahead = this.x + (this.facing > 0 ? this.w + 2 : -2);
      if (!w.solidFor(this, w.codeAtPx(ahead, this.y + this.h + 2))) this.facing *= -1;
    }
  } else if (this.type === 'bat') {
    var near = Math.abs(p.x - this.x) < 104 && Math.abs(p.y - this.y) < 84;
    if (near) {
      var ax = p.x + p.w / 2 - (this.x + this.w / 2);
      var ay = p.y + p.h / 2 - (this.y + this.h / 2);
      var m = Math.max(1, Math.sqrt(ax * ax + ay * ay));
      this.vx = Util.approach(this.vx, (ax / m) * this.speed, 0.05);
      this.vy = Util.approach(this.vy, (ay / m) * this.speed, 0.05);
    } else {
      this.vx = Util.approach(this.vx, Math.sin(this.t * 0.02) * 0.55, 0.04);
      this.vy = Util.approach(this.vy, (this.homeY - this.y) * 0.03 + Math.sin(this.t * 0.07) * 0.35, 0.05);
    }
    w.moveActor(this, false, true);
    if (this.hitWall) this.vx *= -1;
    if (this.vx !== 0) this.facing = this.vx > 0 ? 1 : -1;
  } else if (this.type === 'hound') {
    this.vy = Math.min(this.vy + GRAV, MAXFALL);
    if (this.state === 'walk') {
      this.vx = Util.approach(this.vx, this.facing * this.speed, 0.08);
      var close = Math.abs(p.x - this.x) < 78 && Math.abs(p.y - this.y) < 40;
      if (close && this.grounded) {
        this.facing = p.x > this.x ? 1 : -1;
        this.state = 'crouch'; this.timer = 22;
      }
    } else if (this.state === 'crouch') {
      this.vx = Util.approach(this.vx, 0, 0.2);
      if (--this.timer <= 0) {
        this.state = 'leap';
        this.vx = this.facing * 2.1; this.vy = -4.7;
        Sfx.bark();
      }
    } else { /* leap */
      if (this.grounded && this.vy >= 0) {
        this.state = 'walk'; this.timer = 0; this.vx *= 0.3;
      }
    }
    w.moveActor(this);
    if (this.hitWall && this.state === 'walk') this.facing *= -1;
    if (this.grounded && this.state === 'walk') {
      var a2 = this.x + (this.facing > 0 ? this.w + 2 : -2);
      if (!w.solidFor(this, w.codeAtPx(a2, this.y + this.h + 2))) this.facing *= -1;
    }
  } else { /* thorn turret */
    this.facing = p.x + p.w / 2 > this.x + this.w / 2 ? 1 : -1;
    this.vy = Math.min(this.vy + GRAV, MAXFALL);
    w.moveActor(this);
    if (--this.timer <= 0) {
      this.timer = 104;
      if (Math.abs(p.x - this.x) < 150) {
        w.shots.push(new Shot(this.x + this.w / 2 - 2, this.y + 5, this.facing * 1.5, 0, 'thorn'));
        Sfx.swing();
      }
    }
  }
};
Enemy.prototype.draw = function (g, cam) {
  var sx = Math.round(this.x - cam.x + this.ox), sy = Math.round(this.y - cam.y + this.oy);
  var img, flashImg;
  if (this.type === 'grub') {
    img = this.facing > 0 ? Art.GRUB_L : Art.GRUB;
    flashImg = Art.GRUB_FLASH;
    sy += Math.round(Math.sin(this.t * 0.2) * 0.8);
  } else if (this.type === 'bat') {
    img = Art.BATLING[Math.floor(this.t / 7) % 2];
    flashImg = Art.BAT_FLASH;
  } else if (this.type === 'hound') {
    var fr = this.facing > 0 ? Art.hound.right : Art.hound.left;
    if (this.state === 'crouch') img = fr.sit;
    else if (this.state === 'leap') img = fr.jump;
    else if (Math.abs(this.vx) > 0.15) img = fr.run[Math.floor(this.t / 7) % 4];
    else img = fr.idle;
    flashImg = this.facing > 0 ? Art.hound.flash.right : Art.hound.flash.left;
    sx -= 2; sy -= 1;
  } else {
    img = this.facing > 0 ? Art.THORN : Art.THORN_L;
    flashImg = Art.THORN_FLASH;
  }
  g.drawImage(img, sx, sy);
  if (this.flash > 0 && flashImg) {
    g.globalAlpha = 0.8;
    g.drawImage(flashImg, sx, sy);
    g.globalAlpha = 1;
  }
};

/* ------------------------------------------------------------------ */
function Boss(x, y, kind) {
  this.kind = kind;
  this.x = x; this.y = y;
  this.vx = 0; this.vy = 0;
  this.facing = -1;
  this.dead = false;
  this.flash = 0;
  this.t = 0;
  this.state = 'wait';
  this.timer = 70;
  this.grounded = false;
  this.hitWall = false;
  this.phase = 1;
  this.spawned = false;
  this.hurtLock = 0;
  if (kind === 'boar') { this.w = 44; this.h = 30; this.hp = 16; this.name = 'GRUMBLEGUT'; }
  else if (kind === 'gloomwing') { this.w = 42; this.h = 26; this.hp = 20; this.name = 'GLOOMWING'; this.homeY = y; }
  else { this.w = 38; this.h = 38; this.hp = 28; this.name = 'THE KENNEL KING'; }
  this.maxHp = this.hp;
  this.y = y - this.h + TILE;
}
Boss.prototype.contactHarmless = function () {
  return this.state === 'stun' || this.state === 'dying';
};
Boss.prototype.hurt = function (dmg, dir, w) {
  if (this.hurtLock > 0 || this.state === 'dying') return;
  this.hurtLock = 10;
  this.hp -= dmg;
  this.flash = 9;
  Sfx.hit();
  w.puff(this.x + this.w / 2, this.y + this.h / 2, '#ffffff', 6);
  if (this.hp <= 0) {
    this.hp = 0;
    this.state = 'dying'; this.timer = 110;
    Sfx.crash();
    w.shake(9);
  } else if (this.hp <= this.maxHp / 2 && this.phase === 1) {
    this.phase = 2;
    w.shake(5);
  }
};
Boss.prototype.update = function (w) {
  this.t++;
  if (this.flash > 0) this.flash--;
  if (this.hurtLock > 0) this.hurtLock--;
  var p = w.player;

  if (this.state === 'dying') {
    this.vx = 0;
    this.vy = Math.min(this.vy + GRAV, MAXFALL);
    if (this.kind !== 'gloomwing') w.moveActor(this);
    else this.y += 0.6;
    if (this.t % 6 === 0) {
      w.puff(this.x + Util.rand(4, this.w - 4), this.y + Util.rand(4, this.h - 4), '#ffb45e', 5);
      Sfx.hit();
    }
    if (--this.timer <= 0) { this.dead = true; w.bossDefeated(); }
    return;
  }

  if (this.kind === 'boar') this.updateBoar(w, p);
  else if (this.kind === 'gloomwing') this.updateWing(w, p);
  else this.updateKing(w, p);
};

Boss.prototype.updateBoar = function (w, p) {
  this.vy = Math.min(this.vy + GRAV, MAXFALL);
  if (this.state === 'wait') {
    this.vx = Util.approach(this.vx, 0, 0.2);
    this.facing = p.x + p.w / 2 > this.x + this.w / 2 ? 1 : -1;
    if (--this.timer <= 0) {
      if (this.phase === 2 && Math.random() < 0.45) { this.state = 'slam'; this.vy = -7.2; this.timer = 0; }
      else { this.state = 'charge'; this.timer = 190; Sfx.bark(); }
    }
  } else if (this.state === 'charge') {
    this.vx = Util.approach(this.vx, this.facing * (this.phase === 2 ? 3.3 : 2.6), 0.22);
    if (this.t % 5 === 0 && this.grounded) {
      w.puff(this.x + (this.facing > 0 ? 0 : this.w), this.y + this.h - 2, '#b89a72', 3);
    }
    if (this.hitWall) {
      this.state = 'stun'; this.timer = 96;
      this.vx = 0;
      Sfx.crash(); w.shake(8);
      for (var i = 0; i < 12; i++) {
        w.parts.push(new Particle(this.x + (this.facing > 0 ? this.w : 0), this.y + Util.rand(4, this.h),
          Util.rand(-2, 2) - this.facing, Util.rand(-2.5, 0), 34, '#d8c49a', 2));
      }
    } else if (--this.timer <= 0) { this.state = 'wait'; this.timer = 50; }
  } else if (this.state === 'stun') {
    this.vx = Util.approach(this.vx, 0, 0.3);
    if (--this.timer <= 0) { this.state = 'wait'; this.timer = 40; }
  } else if (this.state === 'slam') {
    this.vx = Util.approach(this.vx, (p.x > this.x ? 1 : -1) * 1.3, 0.1);
    if (this.grounded && this.vy >= 0 && this.t % 2 === 0) {
      Sfx.crash(); w.shake(7);
      w.shots.push(new Shot(this.x - 6, this.y + this.h - 12, -2.0, 0, 'shock'));
      w.shots.push(new Shot(this.x + this.w + 2, this.y + this.h - 12, 2.0, 0, 'shock'));
      this.state = 'wait'; this.timer = 60;
      if (!this.spawned && this.phase === 2) {
        this.spawned = true;
        w.spawnEnemy(this.x - 30, this.y, 'grub');
        w.spawnEnemy(this.x + this.w + 20, this.y, 'grub');
      }
    }
  }
  w.moveActor(this);
};

Boss.prototype.updateWing = function (w, p) {
  var cx = this.x + this.w / 2;
  this.facing = p.x + p.w / 2 > cx ? 1 : -1;
  if (this.state === 'wait' || this.state === 'hover') {
    var targetX = p.x + p.w / 2 - this.w / 2;
    this.vx = Util.approach(this.vx, Util.clamp((targetX - this.x) * 0.03, -1.3, 1.3), 0.06);
    this.vy = Util.approach(this.vy, (this.homeY - this.y) * 0.04 + Math.sin(this.t * 0.06) * 0.5, 0.08);
    if (--this.timer <= 0) {
      var r = Math.random();
      if (this.phase === 2 && r < 0.3) { this.state = 'screech'; this.timer = 56; Sfx.bark(); }
      else { this.state = 'dive'; this.timer = 96; Sfx.bark(); }
    }
  } else if (this.state === 'dive') {
    var dx = p.x + p.w / 2 - cx, dy = p.y - this.y;
    var m = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    var sp = this.phase === 2 ? 2.5 : 2.0;
    this.vx = Util.approach(this.vx, (dx / m) * sp, 0.13);
    this.vy = Util.approach(this.vy, (dy / m) * sp, 0.13);
    if (--this.timer <= 0 || w.solidAt(cx, this.y + this.h + 2)) {
      this.state = 'rise'; this.timer = 70;
    }
  } else if (this.state === 'rise') {
    this.vy = Util.approach(this.vy, -1.6, 0.1);
    this.vx = Util.approach(this.vx, 0, 0.08);
    if (this.y <= this.homeY + 6 || --this.timer <= 0) {
      this.state = 'hover'; this.timer = 70;
    }
  } else if (this.state === 'screech') {
    this.vx = Util.approach(this.vx, 0, 0.14);
    this.vy = Util.approach(this.vy, Math.sin(this.t * 0.3) * 0.6, 0.1);
    if (this.timer === 30) {
      for (var a = -1; a <= 1; a++) {
        w.shots.push(new Shot(cx - 2, this.y + this.h, a * 0.9, 1.5, 'sonic'));
      }
      if (!this.spawned) {
        this.spawned = true;
        w.spawnEnemy(this.x - 40, this.homeY + 10, 'bat');
        w.spawnEnemy(this.x + this.w + 30, this.homeY + 10, 'bat');
      }
    }
    if (--this.timer <= 0) { this.state = 'hover'; this.timer = 46; }
  }
  w.moveActor(this, false, true);
  if (this.hitWall) this.vx *= -0.6;
};

Boss.prototype.updateKing = function (w, p) {
  this.vy = Math.min(this.vy + GRAV, MAXFALL);
  var gap = (p.x + p.w / 2) - (this.x + this.w / 2);
  if (this.state !== 'dash') this.facing = gap > 0 ? 1 : -1;

  if (this.state === 'wait') {
    this.vx = Util.approach(this.vx, 0, 0.2);
    if (--this.timer <= 0) {
      var r = Math.random();
      if (Math.abs(gap) < 40) { this.state = 'sweep'; this.timer = 40; }
      else if (r < 0.34) { this.state = 'slam'; this.vy = -6.6; }
      else if (r < 0.62 && this.phase === 2) { this.state = 'dash'; this.timer = 56; Sfx.bark(); }
      else if (r < 0.74 && this.phase === 2 && !this.spawned) {
        this.spawned = true; this.state = 'summon'; this.timer = 50;
      } else { this.state = 'walk'; this.timer = 80; }
    }
  } else if (this.state === 'walk') {
    this.vx = Util.approach(this.vx, this.facing * 0.9, 0.12);
    if (--this.timer <= 0 || Math.abs(gap) < 34) { this.state = 'wait'; this.timer = 26; }
  } else if (this.state === 'sweep') {
    this.vx = Util.approach(this.vx, 0, 0.3);
    if (this.timer === 22) {
      Sfx.swing();
      w.bossMelee = {
        x: this.x + (this.facing > 0 ? this.w - 4 : -26), y: this.y + 10,
        w: 30, h: 20, life: 10
      };
    }
    if (--this.timer <= 0) { this.state = 'wait'; this.timer = 38; }
  } else if (this.state === 'slam') {
    this.vx = Util.approach(this.vx, this.facing * 1.1, 0.1);
    if (this.grounded && this.vy >= 0) {
      Sfx.crash(); w.shake(8);
      w.shots.push(new Shot(this.x - 8, this.y + this.h - 12, -2.2, 0, 'shock'));
      w.shots.push(new Shot(this.x + this.w + 2, this.y + this.h - 12, 2.2, 0, 'shock'));
      this.state = 'wait'; this.timer = 48;
    }
  } else if (this.state === 'dash') {
    this.vx = Util.approach(this.vx, this.facing * 3.4, 0.4);
    if (this.t % 4 === 0) w.puff(this.x + this.w / 2, this.y + this.h - 3, '#b9a2d8', 3);
    if (this.hitWall || --this.timer <= 0) {
      this.state = 'wait'; this.timer = 44;
      if (this.hitWall) { w.shake(5); Sfx.crash(); }
    }
  } else if (this.state === 'summon') {
    this.vx = Util.approach(this.vx, 0, 0.3);
    if (this.timer === 24) {
      w.spawnEnemy(this.x - 34, this.y + 10, 'hound');
      w.spawnEnemy(this.x + this.w + 24, this.y + 10, 'hound');
      Sfx.bark();
    }
    if (--this.timer <= 0) { this.state = 'wait'; this.timer = 40; }
  }
  w.moveActor(this);
};

Boss.prototype.draw = function (g, cam) {
  Art.drawBoss(g, { x: this.x - cam.x, y: this.y - cam.y, w: this.w, h: this.h,
    facing: this.facing, state: this.state, kind: this.kind, flash: this.flash }, this.t);
};

/* ------------------------------------------------------------------ */
function Player(x, y) {
  this.x = x; this.y = y;
  this.w = 12; this.h = 14;
  this.vx = 0; this.vy = 0;
  this.facing = 1;
  this.grounded = false;
  this.hitWall = false;
  this.t = 0;
  this.maxHp = 3 + Save.get().collar;
  this.hp = this.maxHp;
  this.invuln = 0;
  this.attack = 0;        /* countdown while swinging */
  this.attackHit = [];    /* things already struck by this swing */
  this.coyote = 0;
  this.buffer = 0;
  this.jumps = BASE_JUMPS;
  this.dead = false;
  this.runFrame = 0;
  this.landSquash = 0;
  this.lift = 0;
}
Player.prototype.damage = function () { return 1 + Save.get().sword; };
Player.prototype.reach = function () { return 13 + Save.get().sword * 2; };

Player.prototype.hurt = function (w, fromX) {
  if (this.invuln > 0 || this.dead) return;
  this.hp--;
  this.invuln = Save.has('guard') ? 96 : 66;
  var dir = (this.x + this.w / 2) < fromX ? -1 : 1;
  this.vx = dir * 2.2; this.vy = -2.6;
  Sfx.hurt(); w.shake(5);
  w.puff(this.x + this.w / 2, this.y + this.h / 2, '#e0424f', 8);
  if (this.hp <= 0) { this.hp = 0; this.die(w); }
};
Player.prototype.die = function (w) {
  if (this.dead) return;
  this.dead = true;
  this.vy = -4.5;
  Sfx.dead();
  w.onPlayerDead();
};

Player.prototype.update = function (w) {
  this.t++;
  if (this.invuln > 0) this.invuln--;
  if (this.landSquash > 0) this.landSquash--;

  if (this.dead) {
    this.vy = Math.min(this.vy + GRAV, MAXFALL);
    this.y += this.vy;
    return;
  }

  var ax = Input.axis();          /* -1..1, analog on a touch stick */
  var speed = Save.has('swift') ? RUN_SPEED_SWIFT : RUN_SPEED;
  var accel = this.grounded ? 0.42 : 0.26;

  if (this.attack > 0 && this.grounded) {
    /* planted while swinging on the ground */
    this.vx = Util.approach(this.vx, 0, 0.35);
  } else if (ax !== 0) {
    this.vx = Util.approach(this.vx, ax * speed, accel);
    if (this.attack <= 0) this.facing = ax > 0 ? 1 : -1;
  } else {
    this.vx = Util.approach(this.vx, 0, this.grounded ? 0.4 : 0.12);
  }

  /* jump, with coyote time and an input buffer */
  if (this.grounded) { this.coyote = 7; this.jumps = Save.has('spring') ? BASE_JUMPS + 1 : BASE_JUMPS; }
  else if (this.coyote > 0) this.coyote--;
  if (Input.pressed('jump')) this.buffer = 7;
  else if (this.buffer > 0) this.buffer--;

  if (this.buffer > 0) {
    if (this.coyote > 0 || this.grounded) {
      this.vy = -JUMP_IMPULSE; this.buffer = 0; this.coyote = 0;
      this.jumps = (Save.has('spring') ? BASE_JUMPS + 1 : BASE_JUMPS) - 1;
      this.grounded = false;
      this.lift = JUMP_LIFT_FRAMES;
      Sfx.jump();
      w.puff(this.x + this.w / 2, this.y + this.h, '#e8e0cc', 4);
    } else if (this.jumps > 0) {
      /* Kill any downward speed first. Without this the air jump fights
         whatever fall was already underway and reads as heavy and vague. */
      this.vy = -DBL_JUMP_IMPULSE;
      this.buffer = 0; this.jumps--;
      this.lift = DBL_LIFT_FRAMES;
      Sfx.dbljump();
      for (var i = 0; i < 6; i++) {
        w.parts.push(new Particle(this.x + this.w / 2, this.y + this.h,
          Util.rand(-1.4, 1.4), Util.rand(-0.4, 1.2), 22, '#bfe9ff', 1));
      }
    }
  }
  /* Hold to rise further. Adding lift over several frames gives a smooth
     range between a tap and a full jump, instead of the abrupt velocity
     cut that made taps feel stunted and holds feel floaty. */
  if (Input.down('jump') && this.lift > 0 && this.vy < 0) {
    this.vy -= JUMP_LIFT;
    this.lift--;
  } else {
    this.lift = 0;
  }

  if (Input.pressed('attack') && this.attack <= 0) {
    this.attack = ATTACK_FRAMES;
    this.attackHit = [];
    Sfx.swing();
  }
  if (this.attack > 0) this.attack--;

  this.vy = Math.min(this.vy + GRAV, MAXFALL);
  var wasAir = !this.grounded;
  w.moveActor(this);
  if (this.grounded && wasAir && this.vy >= 0) {
    this.landSquash = 5;
    if (Math.abs(this.vy) > 2) { Sfx.land(); w.puff(this.x + this.w / 2, this.y + this.h, '#e8e0cc', 3); }
  }

  if (Math.abs(this.vx) > 0.45 && this.grounded) this.runFrame += Math.abs(this.vx) * 0.11;
  else if (this.grounded) this.runFrame = 0;   /* stand still, legs still */
};

/* Active blade rectangle during the middle of a swing, else null. */
Player.prototype.hitbox = function () {
  if (this.attack > 14 || this.attack < 5) return null;
  var r = this.reach();
  return {
    x: this.facing > 0 ? this.x + this.w - 3 : this.x - r + 3,
    y: this.y - 2,
    w: r, h: 17
  };
};

Player.prototype.bladeAngleAt = function (k) {
  return -1.25 + Util.clamp(k * 1.35, 0, 1) * 2.25;
};
Player.prototype.bladeAngle = function () {
  if (this.attack <= 0) return -0.45;
  return this.bladeAngleAt(1 - (this.attack / ATTACK_FRAMES));
};

Player.prototype.draw = function (g, cam) {
  if (this.invuln > 0 && Math.floor(this.invuln / 4) % 2 === 0 && !this.dead) return;
  var set = this.facing > 0 ? Art.dog.right : Art.dog.left;
  var img;
  if (this.dead) img = set.sit;
  else if (this.attack > 0) img = this.grounded ? set.swing : set.swingAir;
  else if (!this.grounded) img = this.vy < -0.6 ? set.jump : set.fall;
  else if (Math.abs(this.vx) > 0.45) img = set.run[Math.floor(this.runFrame) % 4];
  else img = set.idle;

  var sx = Math.round(this.x - cam.x - 3);
  var sy = Math.round(this.y - cam.y) + (this.landSquash > 2 ? 1 : 0);

  /* blade first when swinging behind, after when in front */
  var bx = sx + (this.facing > 0 ? 13 : 5);
  var by = sy + 8;
  g.drawImage(img, sx, sy);
  Art.drawBlade(g, bx, by, this.bladeAngle(), Save.get().sword, this.facing);

  /* Slash: a crescent that trails the blade through its arc and fades
     out with the swing, rather than a static ring hanging in the air. */
  if (this.attack > 2) {
    var prog = 1 - (this.attack / ATTACK_FRAMES);
    var a1 = this.bladeAngleAt(prog);
    var a0 = this.bladeAngleAt(Math.max(0, prog - 0.34));
    if (a1 - a0 > 0.03) {
      var reach = this.reach();
      var tier = Save.get().sword;
      var col = tier >= 3 ? '210,250,255' : (tier >= 2 ? '255,208,138' : '255,255,255');
      var fade = Util.clamp((this.attack - 2) / 9, 0, 1);
      g.save();
      g.translate(bx, by);
      g.scale(this.facing, 1);
      /* two nested wedges: a bright leading edge over a softer body */
      var bands = [[reach * 0.52, reach * 1.0, 0.30], [reach * 0.78, reach * 0.99, 0.55]];
      for (var bI = 0; bI < bands.length; bI++) {
        g.beginPath();
        g.arc(0, 0, bands[bI][1], a0, a1);
        g.arc(0, 0, bands[bI][0], a1, a0, true);
        g.closePath();
        g.fillStyle = 'rgba(' + col + ',' + (bands[bI][2] * fade).toFixed(3) + ')';
        g.fill();
      }
      g.restore();
    }
  }
};

/* ===== world.js ===== */
/* The playable level: tilemap, collision, camera and HUD. */
/* VIEW_H is fixed so the vertical framing is identical everywhere.
   VIEW_W is recomputed from the real screen aspect at boot and on every
   resize, so the picture fills the display instead of being letterboxed
   inside black bars. */
var VIEW_W = 400, VIEW_H = 224;
var T_EMPTY = 0, T_SOLID = 1, T_PLAT = 2, T_SPIKE = 3, T_HAZ = 4, T_CRATE = 5, T_SPRING = 6;
/* Looks exactly like solid masonry, but you walk straight through it. */
var T_FAKE = 7;

function World(stageIndex) {
  var def = LEVELS[stageIndex];
  this.index = stageIndex;
  this.def = def;
  this.theme = def.theme;
  this.tileset = Art.tiles(def.theme);

  var w = 0, i, y, x;
  for (i = 0; i < def.rows.length; i++) w = Math.max(w, def.rows[i].length);
  this.cols = w; this.rows = def.rows.length;
  this.pixelW = w * TILE; this.pixelH = this.rows * TILE;

  this.tiles = [];
  this.enemies = []; this.pickups = []; this.shots = [];
  this.parts = []; this.texts = []; this.movers = []; this.chests = [];
  this.revealed = {};
  this.gemsGot = 0; this.chestsGot = 0;
  this.door = null; this.boss = null; this.bossMelee = null;
  var spawn = { x: TILE * 2, y: TILE * 2 };

  for (y = 0; y < this.rows; y++) {
    var row = def.rows[y];
    while (row.length < w) row += ' ';
    var line = [];
    for (x = 0; x < w; x++) {
      var ch = row[x], code = T_EMPTY;
      var px = x * TILE, py = y * TILE;
      switch (ch) {
        case '#': code = T_SOLID; break;
        case '=': code = T_PLAT; break;
        case '^': code = T_SPIKE; break;
        case '%': code = T_HAZ; break;
        case 'K': code = T_CRATE; break;
        case 'S': code = T_SPRING; break;
        case 'F': code = T_FAKE; break;
        case 'C': this.chests.push(new Chest(px + 1, py + 3)); break;
        case 'G':
          var gem = new Pickup(px + 5, py + 5, 'gem');
          gem.theme = def.theme;
          this.pickups.push(gem);
          break;
        case 'P': spawn = { x: px + 2, y: py + 2 }; break;
        case 'D': this.door = { x: px, y: py - TILE, w: TILE, h: TILE * 2 }; break;
        case 'o': this.pickups.push(new Pickup(px + 4, py + 4, 'coin')); break;

        case 'H': this.pickups.push(new Pickup(px + 4, py + 4, 'meat')); break;
        case 'g': this.enemies.push(new Enemy(px + 2, py + 4, 'grub', def.world)); break;
        case 'b': this.enemies.push(new Enemy(px + 2, py + 4, 'bat', def.world)); break;
        case 'h': this.enemies.push(new Enemy(px + 1, py + 1, 'hound', def.world)); break;
        case 't': this.enemies.push(new Enemy(px + 2, py + 2, 'thorn', def.world)); break;
        case 'X': this.bossSpawn = { x: px, y: py }; break;
      }
      line.push(code);
    }
    this.tiles.push(line);
  }

  var mv = MOVERS[def.id] || [];
  for (i = 0; i < mv.length; i++) {
    var m = mv[i];
    this.movers.push({
      x: m.tx * TILE, y: m.ty * TILE, w: m.tw * TILE, h: 6,
      ox: m.tx * TILE, oy: m.ty * TILE,
      dx: m.dx, dy: m.dy, span: m.span, dir: 1, mx: 0, my: 0
    });
  }
