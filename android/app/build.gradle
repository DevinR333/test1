plugins { id 'com.android.application' }

android {
    namespace 'com.buddyblade.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.buddyblade.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // so "release" installs too
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* No libraries on purpose. The activity extends the platform Activity and
   the game is plain HTML in assets, so there is nothing to conflict and
   nothing to download beyond Gradle and the Android plugin. */
dependencies { }
