# If Android Studio's Gradle JDK is wrong, the build fails before it compiles anything.
# Easiest fix is the IDE setting (see README > Troubleshooting), but you can also pin the JDK
# for this project by uncommenting and editing the line below:
# org.gradle.java.home=/path/to/jdk-17

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# This Android Gradle plugin predates API 36, so it warns that it has not been tested against
# it. The warning is only a warning - the build works - and this silences it. If Android Studio
# offers to upgrade the plugin (Tools > AGP Upgrade Assistant), taking it is the tidier fix and
# this line can then go.
android.suppressUnsupportedCompileSdk=36

android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official
