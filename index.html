<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buddy Blade">
<title>Buddy Blade</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="screen" width="400" height="224"></canvas>
    <div id="touch" class="hidden">
      <div id="stickzone"></div>
      <div id="stick"><div id="knob"></div></div>
      <div class="acts">
        <button class="tbtn act atk" data-key="attack" aria-label="Swing">SWING</button>
        <button class="tbtn act jmp" data-key="jump" aria-label="Jump">JUMP</button>
      </div>
      <button class="tbtn sys" data-key="pause" aria-label="Pause">II</button>
    </div>
    <div id="menubtns" class="hidden">
      <button class="mbtn" id="mb-left">LEVEL SELECT</button>
      <button class="mbtn" id="mb-right">PLAY AGAIN</button>
    </div>
  </div>
  <script src="src/util.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/text.js"></script>
  <script src="src/art.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/save.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/world.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
